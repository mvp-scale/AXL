const groups=[{"id": "g0", "name": "System consistency", "source": "Your research kit", "url": "ATTRIBUTION.md#research-kit", "actions": ["packages/gauntlet-ui/DESIGN.md is the base system every gauntlet inherits: layout, spacing rhythm, type scale *structure*, motion vocabulary, the celebration moments, and the component inventory.", "apps/<gauntlet>/brand.md overrides only the brand layer (see 02).", "Reference both from CLAUDE.md / AGENTS.md under a \"UI & Design System\" heading so discovery doesn't depend on each agent's own conventions.", "The prose explains decisions; it does not restate the tokens. \"Body text is 17px because answers are read right after speaking, on a phone, often while stressed\" helps an agent. \"Body is 17px\" alone does not.", "One source of truth. Tokens in the YAML are generated into CSS and TS (03). Never hand-edit the generated files.", "A stale file is worse than none. CI checks that the YAML tokens match the generated @theme output (07).", "Never copy another company's DESIGN.md. The 67k-star awesome-design-md collection is fine for studying structure. Copying its tokens gives you a knockoff (Adam Wathan's criticism).", "DESIGN.md covers tokens, not behavior. Component behavior (states, focus, loading) comes from the component registry and its types, not from this file."], "origin": "Compiled guidance \u00b7 01-design-md.md \u00b7 25 Sep 2026"}, {"id": "g1", "name": "Brand direction", "source": "Your research kit", "url": "ATTRIBUTION.md#research-kit", "actions": ["Audience + worst day. Who is in the room, and what is at stake?", "Three adjectives + three anti-adjectives. Every later taste decision is checked against these.", "Aesthetic family, named explicitly, e.g. \"editorial broadsheet\", \"flight-deck instrument\", \"field notebook\", \"arcade boss fight\". Unnamed direction drifts to the generic default.", "Two or three references (real products or cultural sources), each with the specific thing being borrowed.", "One signature element, the thing people will remember (e.g. the Climb mountain, a verdict stamp, a pressure gauge).", "The brand layer changes only brand values. A brand can't change the spacing rhythm, verdict colors, component behavior or the moment catalog. That boundary is what keeps \"different genre, same game\" true.", "Seed, don't hand-pick. One brand color goes in; the generator produces the 12 steps plus dark mode with contrast guaranteed (03). Hand-picked palettes are where contrast failures and muddy dark modes come from.", "Contrast is validated at build time, via design.md lint and the generator. It is never checked by eye."], "origin": "Compiled guidance \u00b7 02-brand-md.md \u00b7 25 Sep 2026"}, {"id": "g2", "name": "Semantic styling \u00b7 1", "source": "Your research kit", "url": "ATTRIBUTION.md#research-kit", "actions": ["Why OKLCH: it is perceptually uniform, so steps look evenly spaced. HSL scales drift purple in the light steps and go muddy in the dark ones.", "The 12 steps have fixed roles (Radix model): 1\u20132 app and subtle backgrounds; 3\u20135 component backgrounds and states; 6\u20138 borders; 9 is the solid brand color (highest chroma); 10 is hover; 11 low-contrast text; 12 high-contrast text.", "Generate, don't pick. Candidate tools are oklch-palette (seed \u2192 12 steps, CSS vars and a Tailwind preset) and OKChroma (contrast built into the math, APCA check). Evaluate both at build time.", "Keep grays and status colors from a proven set (Radix Colors), tinted toward the brand hue, and generate only the brand scale. Radix itself recommends this split.", "Light and dark come from the same generator run, not a hand-made second palette.", "Use @theme for tokens that should become utilities, and :root for variables that shouldn't.", "For runtime theme switching, keep raw values in :root / .dark and map them through @theme. Before relying on @theme inline, test the dark-mode switch; sources disagree on whether it survives runtime switching.", "Add @custom-variant dark (&:where(.dark, .dark *)); so the dark: variant follows the class.", "Class names must be complete literal strings. Never build one like  bg-${color} . Conditional classes go through variants or cn().", "Motion tokens (durations, springs) also live in the token layer, so CSS and Motion read the same values (05).", "Typed skin. GauntletSkin (item 5 in ARCHITECTURE \u00a74) is a typed object that the brand.md build step generates and validates. A missing tagline or an unknown motion temperament is a type error, not a runtime surprise.", "Typed variants. Use tailwind-variants for multi-slot components (RunView, ReportView, Verdict, and the Worst Day HUD). It has slots, compound variants and built-in merging, and it infers VariantProps types. Use CVA only for trivial single-element components, or skip it and stay on one library."], "origin": "Compiled guidance \u00b7 03-tokens-and-typescript.md \u00b7 25 Sep 2026"}, {"id": "g3", "name": "Semantic styling \u00b7 2", "source": "Your research kit", "url": "ATTRIBUTION.md#research-kit", "actions": ["v4 caveat: tailwind-variants' responsive variants were removed. Use plain responsive prefixes inside the variant strings.", "Domain-typed props, not style props. Components take band: 'absent' | 'gestured' | 'landed' | 'nailed', not color=\"green\". The engine's vocabulary *is* the design API, which ties visual meaning to scoring meaning.", "Only token-backed classes appear in variant files. If text-gray-500 shows up, the right token is missing or wasn't used. Lint catches both (07)."], "origin": "Compiled guidance \u00b7 03-tokens-and-typescript.md \u00b7 25 Sep 2026"}, {"id": "g4", "name": "Component discipline", "source": "Your research kit", "url": "ATTRIBUTION.md#research-kit", "actions": ["We own the source: components are copied into the repo, not hidden in node_modules.", "Accessibility comes from Base UI.", "Agents already know the conventions, and shadcn ships agent skills for them.", "Our own registry. packages/gauntlet-ui publishes a registry.json with a registry:style using \"extends\": \"none\" (fully independent), plus cssVars in theme / light / dark scopes. Each gauntlet app installs components from *our* registry, not upstream.", "Pick a starting style per brand shape. shape: sharp \u2192 Lyra (boxy, pairs with mono), soft \u2192 Maia, compact \u2192 Mira. It's only a starting point, since our tokens override it.", "Game components beyond shadcn's set live in the same registry: Verdict, BeatTrack, RecordButton, LatencyStage, ClimbMountain, WorstDayHUD, Celebration. These are what make it a game rather than a dashboard.", "Known trap: switching or re-applying a shadcn preset rewrites component classes and wipes custom variants. Set the preset once at init, then manage everything through our registry and tokens, never with preset apply.", "Upstream updates come in through shadcn add --diff and are reviewed, never blindly overwritten.", "That Base UI is the shadcn default since July 2026 (one source; check the changelog).", "The exact list of 8 styles (one third-party source).", "Whether the Tailwind Plus licenses we might already hold get updates."], "origin": "Compiled guidance \u00b7 04-component-systems.md \u00b7 25 Sep 2026"}, {"id": "g5", "name": "Meaningful motion", "source": "Your research kit", "url": "ATTRIBUTION.md#research-kit", "actions": ["Durations: instant (\u2248100ms), fast (\u2248150ms), base (\u2248250ms), slow (\u2248400ms), and moment for choreographed sequences.", "Springs: the brand's motion-temperament (crisp / bouncy / weighty) picks a { visualDuration, bounce } preset. The same values feed MotionConfig, AnimateView and the CSS easings.", "Stagger: one shared value for list and evidence reveals.", "Choreograph; don't scatter. One orchestrated sequence per moment, using staggered reveals, a clear order, and a clear final rest state.", "Motion carries meaning. Direction and weight encode the outcome: success rises and settles, a miss holds and redirects. Never play a generic bounce on everything.", "Reduced motion is required. Set <MotionConfig reducedMotion=\"user\"> explicitly at the root; don't assume it's the default. Add a @media (prefers-reduced-motion) block for View Transitions, since React won't do that for you. Replace large transforms with opacity changes. Anything that loops or autoplays needs a pause control (WCAG 2.2.2).", "Performance: pause offscreen Rive files, cache reused .riv files, and scope view transitions tightly (snapshots are costly on low-end phones).", "Screenshot tests freeze motion so baselines are deterministic (07)."], "origin": "Compiled guidance \u00b7 05-motion-and-celebration.md \u00b7 25 Sep 2026"}, {"id": "g6", "name": "Anti-slop \u00b7 1", "source": "Your research kit", "url": "ATTRIBUTION.md#research-kit", "actions": ["Inter, Roboto, Arial, Open Sans, Lato, system-ui as the *display* face", "Space Grotesk (the model's fallback once Inter is banned)", "A single font family used for everything", "Timid scale steps (14/16/18). Use real contrast between sizes", "A purple or blue gradient on white or near-black", "The 2026 \"anti-slop\" tell: a warm cream background + a serif display face (Instrument Serif, Fraunces) + a sage or forest-green accent. It's what you get by swapping one default for another", "Colors spread evenly with no dominant one", "Pure #000 / #fff surfaces with untinted grays", "Gradient text as decoration", "A centered hero, then three feature cards, then a CTA band", "Every section in the same rounded card with the same shadow", "Uniform spacing everywhere, with no rhythm and no tension"], "origin": "Compiled guidance \u00b7 06-anti-slop.md \u00b7 25 Sep 2026"}, {"id": "g7", "name": "Anti-slop \u00b7 2", "source": "Your research kit", "url": "ATTRIBUTION.md#research-kit", "actions": ["Pill badges and \"\u2728 New\" chips as decoration", "Glassmorphism as the default surface", "Emoji used as icons", "Generic stock illustrations or blob backgrounds", "Mixed icon sets, or icons used where a word would read better", "Fade-up on every element as it scrolls in", "Hover-scale on every card", "Spinners where a latency choreography belongs (05)", "\"Unlock your potential\", \"Supercharge\", \"Seamless\", \"Elevate\", \"Revolutionize\"", "Generic empty states (\"Nothing here yet!\"). Write each one in the brand voice", "A named aesthetic family and three adjectives (02).", "A distinctive display face paired with a refined body face. Pick with intent, and look past the usual places: editorial serifs, grotesques with character, mono for data."], "origin": "Compiled guidance \u00b7 06-anti-slop.md \u00b7 25 Sep 2026"}, {"id": "g8", "name": "Anti-slop \u00b7 3", "source": "Your research kit", "url": "ATTRIBUTION.md#research-kit", "actions": ["One dominant color with sharp accents. For inspiration, look at IDE themes, print, sport, signage, and cultural aesthetics, not other SaaS sites.", "Backgrounds with atmosphere: texture, grain, a tinted ground, or a structural grid. Never a flat default gray.", "One signature element per brand that nobody else has.", "Hierarchy through contrast. Size, weight and space do the work before color does.", "Data looks like instruments. Scores, beats and the mountain are designed visualizations, not stat cards.", "Could this screen be a different product's with the logo swapped? If yes, it's slop.", "Does it match the three adjectives, and avoid the three anti-adjectives?", "What is the one thing a user remembers from this screen?", "Is the most important thing visually the most important?"], "origin": "Compiled guidance \u00b7 06-anti-slop.md \u00b7 25 Sep 2026"}, {"id": "g9", "name": "Verification", "source": "Your research kit", "url": "ATTRIBUTION.md#research-kit", "actions": ["Escape hatch with a reason. An exception requires a stated reason (e.g. a designSystemException=\"\u2026\" prop or a lint-disable with a justification) so it stays visible.", "Ratchet baseline. When adopting on existing code, record the current violation count; it can only go down.", "Monorepo: set settings[\"better-tailwindcss\"].cwd per app. Plugins switch off silently when they can't resolve Tailwind, so CI must assert that the plugin is active.", "Playwright MCP gives Claude a real browser (claude mcp add playwright npx '@playwright/mcp@latest').", "Define \"verified\" explicitly. Otherwise an agent with a screenshot tool will still declare a broken page done. Our definition: the screenshot is checked at 375px and 1440px, in light and dark, with every celebration moment shown in its final state, and passes the 06 gut check.", "Measure, don't eyeball. Use Playwright evaluate to check computed font family, size and color against the tokens.", "Playwright toHaveScreenshot for each screen \u00d7 brand \u00d7 theme \u00d7 width.", "Generate baselines in the same container image CI uses. Commit them, and never update one without looking at the diff.", "Keep them deterministic: mask dynamic content, freeze animations (reduced-motion mode plus the Motion test config), and use fixed fonts. Fix flakiness at the source; never raise the tolerance.", "Anti-slop audit against 06.", "Celebration audit: does each moment in the 05 catalog fire on the right event, and does it degrade cleanly under reduced motion?"], "origin": "Compiled guidance \u00b7 07-guardrails-and-verification.md \u00b7 25 Sep 2026"}, {"id": "g10", "name": "Agent design workflow \u00b7 1", "source": "Your research kit", "url": "ATTRIBUTION.md#research-kit", "actions": ["Brand brief interview: the five questions in 02. No code.", "Write brand.md. The user approves it.", "Generate tokens: OKLCH scales, @theme CSS, TS skin types. Run the contrast lint.", "Specimen page first: type, color steps, verdict bands, every component variant, and each moment in its final state, on one page. The user approves the *look* here, before any real screens exist. This is the cheapest place to fix taste.", "Build screens from registry components only. Missing component \u2192 add it to the registry with variants, never a one-off.", "Self-verify: lint green, Playwright screenshots at 375/1440 \u00d7 light/dark, and computed styles match the tokens.", "/design-review, including the anti-slop and celebration audits.", "Commit baselines, and the result is Rev1.", "Name the direction out loud before writing UI (aesthetic family + adjectives). If it can't be named, stop and ask.", "Iterate on the output; don't re-prompt from scratch. Adjust tokens and components from the screenshot, as the Claude Design \"Tweaks\" pattern does.", "Use Context7 for library APIs. Tailwind v4, shadcn CLI v4, Base UI, Motion and View Transitions have all changed in 2025\u201326, so training memory is out of date.", "No speculative components. Build only what a screen needs, but always as a registry item with typed variants."], "origin": "Compiled guidance \u00b7 08-claude-workflow.md \u00b7 25 Sep 2026"}, {"id": "g11", "name": "Agent design workflow \u00b7 2", "source": "Your research kit", "url": "ATTRIBUTION.md#research-kit", "actions": ["Claude's own design tools (/design artboards, Claude Design) are good for exploring a brand in steps 1\u20134, and their output goes back into brand.md tokens."], "origin": "Compiled guidance \u00b7 08-claude-workflow.md \u00b7 25 Sep 2026"}, {"id": "g12", "name": "Polish", "source": "Impeccable \u00b7 Paul Bakaus", "url": "https://github.com/pbakaus/impeccable/blob/main/skill/reference/polish.md", "actions": ["missing token: the system needs a reusable value;", "one-off implementation: an existing shared component or pattern should replace it;", "conceptual mismatch: the flow, information architecture, or hierarchy differs from comparable product areas;", "local defect: the implementation is simply incomplete or inconsistent.", "whether the path is functionally complete;", "the intended quality bar and time available;", "known constraints or deliberately unfinished work;", "the states, content lengths, roles, and input methods users will actually encounter.", "Match neighboring mental models, terminology, disclosure, routing, save behavior, and optimistic or pessimistic patterns.", "Make the primary task and current state obvious without flattening every element to equal weight.", "Ensure arrival, transition, empty, and recovery paths connect instead of behaving as isolated screens.", "Align to the project's grid and spacing scale; fix optical as well as mathematical alignment.", "Group related content tightly and separate distinct groups generously.", "Keep same-role typography consistent; test measure, wrapping, localization expansion, zoom, and font loading.", "Verify every supported viewport rather than correcting only the current screenshot."], "origin": "Published command \u00b7 lab maps examples; source determines scope"}, {"id": "g13", "name": "Distill", "source": "Impeccable \u00b7 Paul Bakaus", "url": "https://github.com/pbakaus/impeccable/blob/main/skill/reference/distill.md", "actions": ["Too many elements: Competing buttons, redundant information, visual clutter", "Excessive variation: Too many colors, fonts, sizes, styles without purpose", "Information overload: Everything visible at once, no progressive disclosure", "Visual noise: Unnecessary borders, shadows, backgrounds, decorations", "Confusing hierarchy: Unclear what matters most", "Feature creep: Too many options, actions, or paths forward", "Core purpose: What's the ONE thing this should accomplish?", "Essential elements: What's truly necessary to achieve that purpose?", "Progressive disclosure: What can be hidden until needed?", "Consolidation opportunities: What can be combined or integrated?", "Reduce scope: Remove secondary actions, optional features, redundant information", "Progressive disclosure: Hide complexity behind clear entry points (accordions, modals, step-through flows)", "Combine related actions: Merge similar buttons, consolidate forms, group related content", "Clear hierarchy: ONE primary action, few secondary actions, everything else tertiary or hidden", "Remove redundancy: If it's said elsewhere, don't repeat it here"], "origin": "Published command \u00b7 lab maps examples; source determines scope"}, {"id": "g14", "name": "Delight", "source": "Impeccable \u00b7 Paul Bakaus", "url": "https://github.com/pbakaus/impeccable/blob/main/skill/reference/delight.md", "actions": ["Persuade + Experience: personality may run through voice, composition, motion, and discovery, provided the artifact remains the focus.", "Operate + Read: concentrate delight at meaningful moments such as first use, completion, recovery, or mastery. Reliability carries everything else.", "effort worth acknowledging;", "waiting that can become informative;", "an empty or first-use state that can orient;", "an error or recovery moment that needs empathy;", "an interaction whose physical or verbal response could express the brand;", "a useful capability people might enjoy discovering.", "a distinctive response to a meaningful action;", "product-specific language that clarifies while carrying voice;", "an interaction or transition with a recognizable material behavior;", "an illustration, sound, haptic, or environmental detail grounded in the product world;", "a discovery reward that reveals real utility.", "Success: match the response to the effort and consequence. Major milestones can expand; routine saves should simply feel certain.", "Waiting: show truthful progress, useful context, or product-specific activity. Never fake work or delay completion to stage a flourish."], "origin": "Published command \u00b7 lab maps examples; source determines scope"}, {"id": "g15", "name": "Bolder", "source": "Impeccable \u00b7 Paul Bakaus", "url": "https://github.com/pbakaus/impeccable/blob/main/skill/reference/bolder.md", "actions": ["Amplify what the system already owns. Reuse its motif and its type scale at full strength, turned up for this section rather than invented for it. The bolder version should lo", "Keep content true. Existing claims are part of the scope: preserve them unless the user supplies replacements. If real evidence is essential to the direction but absent, ask f", "Commit, then clarify. Half-measures read as noise. Make the one decisive move completely, then quiet everything around it so the move is legible. If every element got louder, ", "Give it its own rhythm. The target should read as a peak in the scroll, a shift in density or pace from what surrounds it, not simply more of the same.", "Everything outside the named target is unchanged.", "No new color, font, or system primitive appeared without being asked for.", "The conventions the section carried, including anything that drives an action, still work the same way.", "The section is unmistakably the same brand, only more sure of itself."], "origin": "Published command \u00b7 lab maps examples; source determines scope"}, {"id": "g16", "name": "Quieter", "source": "Impeccable \u00b7 Paul Bakaus", "url": "https://github.com/pbakaus/impeccable/blob/main/skill/reference/quieter.md", "actions": ["Color saturation: Overly bright or saturated colors", "Contrast extremes: Too much high-contrast juxtaposition", "Visual weight: Too many bold, heavy elements competing", "Animation excess: Too much motion or overly dramatic effects", "Complexity: Too many visual elements, patterns, or decorations", "Scale: Everything is large and loud with no hierarchy", "Color approach: Desaturate or shift to more restrained tones?", "Hierarchy approach: Which elements should stay bold (very few), which should recede?", "Simplification approach: What can be removed entirely?", "Sophistication approach: How can we signal quality through restraint?", "Reduce saturation: Shift from fully saturated to 70-85% saturation", "Soften palette: Replace bright colors with muted tones", "Reduce color variety: Use fewer colors more thoughtfully", "Neutral dominance: Let neutrals do arden", "source": "Impeccable \u00b7 Paul Bakaus", "url": "https://github.com/pbakaus/impeccable/blob/main/skill/reference/harden.md", "actions": ["Long text: Try names with 100+ characters", "Emoji: Use emoji in all text fields", "RTL: Test with Arabic or Hebrew", "CJK: Test with Chinese/Japanese/Korean", "Network issues: Disable internet, throttle connection", "Large datasets: Test with 1000+ items", "Concurrent actions: Click submit 10 times rapidly", "Interrupted gestures: Add a second finger mid-drag, scroll across the control, release outside it, switch windows mid-drag; then drag again", "Errors: Force API errors, test all error states", "Empty: Remove all data, test empty states"], "origin": "Published command \u00b7 lab maps examples; source determines scope"}, {"id": "g21", "name": "Adapt", "source": "Impeccable \u00b7 Paul Bakaus", "url": "https://github.com/pbakaus/impeccable/blob/main/skill/reference/adapt.md", "actions": ["Device: Mobile, tablet, desktop, TV, watch, print?", "Input method: Touch, mouse, keyboard, voice, gamepad?", "Screen constraints: Size, resolution, orientation?", "Connection: Fast wifi, slow 3G, offline?", "Usage context: On-the-go vs desk, quick glance vs focused reading?", "User expectations: What do users expect on this platform?", "CSS Grid/Flexbox: Reflow layouts automatically", "Container Queries: Adapt based on container, not viewport", "`clamp()`: Fluid sizing between min and max", "Media queries: Different styles for different contexts", "Display properties: Show/hide elements per context", "Real devices: Test on actual phones, tablets, desktops", "Different orientations: Portrait and landscape", "Different browsers: Safari, Chrome, Firefox, Edge", "Different OS: iOS, Android, Windows, macOS"], "origin": "Published command \u00b7 lab maps examples; source determines scope"}, {"id": "g22", "name": "Optimize", "source": "Impeccable \u00b7 Paul Bakaus", "url": "https://github.com/pbakaus/impeccable/blob/main/skill/reference/optimize.md", "actions": ["Core Web Vitals: LCP, INP, CLS scores", "Load time: Time to interactive, first contentful paint", "Bundle size: JavaScript, CSS, image sizes", "Runtime performance: Frame rate, memory usage, CPU usage", "Network: Request count, payload sizes, waterfall", "Before/after metrics: Compare Lighthouse scores", "Real user monitoring: Track improvements for real users", "Different devices: Test on low-end Android, not just flagship iPhone", "Slow connections: Throttle to 3G, test experience", "No regressions: Ensure functionality still works", "User perception: Does it *feel* faster?"], "origin": "Published command \u00b7 lab maps examples; source determines scope"}, {"id": "g23", "name": "Typeset", "source": "Impeccable \u00b7 Paul Bakaus", "url": "https://github.com/pbakaus/impeccable/blob/main/skill/reference/typeset.md", "actions": ["Persuade + Experience: display type may carry the voice. Use decisive contrast and responsive scale when the composition benefits.", "Operate + Read: stability, scanability, and measure come first. A single well-tuned family and fixed role scale are often right.", "Native: follow [ios.md](ios.md) or [android.md](android.md), including platform scaling and accessibility behavior.", "Authority and fit: Which faces, weights, and roles are established? Do they fit the product and selected world, or are they unexamined defaults? Is every family necessary?", "Hierarchy: Can heading, body, label, metadata, and data roles be distinguished at a glance? Are adjacent sizes or weights too close to carry different jobs?", "Scale and consistency: Is there a deliberate role scale, or a collection of arbitrary values? Do repeated roles stay identical across screens and states?", "Reading: Does body copy stay within a comfortable 45\u201375 character measure? Are line height, paragraph rhythm, contrast, and tracking tuned to the actual face, width, language,", "Stress: What happens with long headings, localization expansion, zoom, ses, wraps, scrolls, or remains fixed? Does DOM and focus order", "Extremes: Do long content, empty states, overlays, sticky elements, safe areas, and small touch targets expose structural failures?"], "origin": "Published command \u00b7 lab maps examples; source determines scope"}, {"id": "g25", "name": "Onboard", "source": "Impeccable \u00b7 Paul Bakaus", "url": "https://github.com/pbakaus/impeccable/blob/main/skill/reference/onboard.md", "actions": ["First use: Never used this feature (emphasize value, provide template)", "User cleared: Intentionally deleted everything (light touch, easy to recreate)", "No results: Search or filter returned nothing (suggest different query, clear filters)", "No permissions: Can't access (explain why, how to get access)", "Error state: Failed to load (explain what happened, retry option)", "Time to completion: Can users complete onboarding quickly?", "Comprehension: Do users understand after completing?", "Action: Do users take desired next step?", "Skip rate: Are too many users skipping? (Maybe it's too long or not valuable)", "Completion rate: Are users completing? (If low, simplify)", "Time to value: How long until users get first value?"], "origin": "Published command \u00b7 lab maps examples; source determines scope"}, {"id": "g26", "name": "Critique", "source": "Impeccable \u00b7 Paul Bakaus", "url": "https://github.com/pbakaus/impeccable/blob/main/skill/reference/critique.md", "actions": ["Design specificity: Is the composition, interaction, and visual language grounded in this product, or could an unrelated product use it unchanged? Make this judgment", "Holistic design: hierarchy, IA, emotional fit, discoverability, composition, typography, color, accessibility, states, copy, and edge cases.", "Cognitive load: consult the [Cognitive Load Assessment](#cognitive-load-assessment) section below; report checklist failures and decision points with >4 visible ", "Emotional journey: peak-end rule, emotional valleys, reassurance at high-stakes moments.", "Nielsen heuristics: consult the [Heuristics Scoring Guide](#heuristics-scoring-guide) section below; score all 10 heuristics 0-4, marking any heuristic the mode-appl", "[P?] What: Name the problem clearly", "Why it matters: How this hurts users or undermines goals", "Fix: What to do about it (be concrete)", "Suggested command: Which command could address this (from: )", "\u22644 items: Within working memory limits, manageable", "5\u20137 items: Pushing the boundary; consider grouping or progressive disclosure", "8+ items: Overloaded; users will skip, misclick, or abandon"], "origin": "Published command \u00b7 lab maps examples; source determines scope"}, {"id": "g27", "name": "Audit", "source": "Impeccable \u00b7 Paul Bakaus", "url": "https://github.com/pbakaus/impeccable/blob/main/skill/reference/audit.md", "actions": ["Contrast issues: Text contrast ratios < 4.5:1 (or 7:1 for AAA)", "Motion sensitivity: prefers-reduced-motion needs an intentional alternative that preserves state change and hierarchy; flag a global 0.01ms kill that destroys useful", "Missing ARIA: Interactive elements without proper roles, labels, or states", "Keyboard navigation: Missing focus indicators, illogical tab order, keyboard traps", "Semantic HTML: Improper heading hierarchy, missing landmarks, divs instead of buttons", "Alt text: Missing or poor image descriptions", "Form issues: Inputs without labels, poor error messaging, missing required indicators", "Layout thrashing: Reading/writing layout properties in loops", "Expensive animations: Casual layout-property animation, unbounded blur/filter/shadow effects, or effects that visibly drop frames", "Missing optimization: Images without lazy loading, unoptimized assets", "will-change overuse: will-change applied broadly or left on at rest (it is a targeted hint for known expensive animations, not a baseline requirement)", "Bundle size: Unnecessary imports, unused dependencies", "Render performance: Unnecessary re- function mapAction(text){let t=text.toLowerCase();if(/^(review|check|audit|detect|verify|report|avoid|ban|no |never|preserve|keep revisions|support|separate|export|generate|compile)/.test(t)||/strictly banned|banned for/.test(t))return null;if(/compact|packed data/.test(t))return 'compact';if(/airy|generous white/.test(t))return 'airy';if(/sharp|precise|boxy/.test(t))return 'crisp';if(/soft.*shape|rounded corner/.test(t))return 'soft';if(/weighty timing/.test(t))return 'weighty';if(/bouncy timing/.test(t))return 'bouncy';if(/tabular|numeric/.test(t))return 'tabular';if(/tracking/.test(t))return 'tracking';if(/wrapping|balance.*heading/.test(t))return 'wrap';if(/paragraph spacing/.test(t))return 'paragraph';if(/tint.*shadow/.test(t))return 'shadow';if(/asymmetr/.test(t))return 'split';if(/linear flow/.test(t))return 'stack';if(/content width/.test(t))return 'width';if(/reduced motion|reduce.*motion/.test(t))return 'reduce';if(/gradient/.test(t))return 'gradient';if(/remove.*card|unnecessary card|flatten structure|card repetition/.test(t))return 'flat';if(/badge|eyebrow/.test(t))return 'badge';if(/font famil|display face|pair.*face/.test(t))return 'serif';if(/focus|keyboard/.test(t))return 'focus';if(/feedback|error|success|empty.state|loading/.test(t))return 'feedback';if(/target/.test(t))return 'target';if(/label|field group/.test(t))return 'labels';if(/line.length|line.height|readab|measure|body text/.test(t))return 'leading';if(/typograph|type scale|heading|hierarchy/.test(t))return 'type';if(/spacing|white.space|rhythm|gap|grid/.test(t))return 'spacing';if(/accent|palette|semantic color|dominant color/.test(t))return 'accent';if(/shadow|radius|surface|border/.test(t))return 'surface';if(/background|tint/.test(t))return 'tint';if(/align/.test(t))return 'align';if(/hover|pressed|transition|crisp timing/.test(t))return 'motion';return null}
const prescriptions=[];groups.forEach(g=>{g.items=g.actions.map((text,i)=>{let a={id:g.id+'-'+i,text,group:g,effect:mapAction(text)};prescriptions.push(a);return a})});
function esc(t){return t.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function selectionHeader(key,title,subtitle,items,kind){let n=items.filter(a=>selected.has(a.id)).length;return `<summary class="selection-header"><input type="checkbox" class="branch-check" data-select-${kind}="${esc(key)}" aria-label="Select all ${items.length} prescriptions under ${esc(title)}" title="Select or clear this entire branch, including all children" ${n===items.length&&items.length?'checked':''} ${!items.length?'disabled':''}><span class="branch-title">${esc(title)}<small>${esc(subtitle)} · <span class="selection-count">${n}/${items.length} selected</span></small></span></summary>`}
function branch(g){let q=$('#search').value.toLowerCase();let items=g.items.filter(a=>(g.name+' '+g.source+' '+a.text).toLowerCase().includes(q));if(!items.length&&q)return '';return `<details data-group="${g.id}" ${q?'open':''}>${selectionHeader(g.id,g.name,g.source,g.items,'branch')}<a class="source-link" href="${g.url}" target="_blank" rel="noopener">Read source</a><div class="source-note">${esc(g.origin)}</div>${!items.length?'<p class="source-note">No prescriptions attributed yet.</p>':''}${items.map(a=>`<label class="action"><input type="checkbox" data-action="${a.id}" ${selected.has(a.id)?'checked':''}><span>${esc(a.text.split(':')[0])}<small>${a.effect?'Live workspace effect':'Context / implementation rule'}</small></span></label>`).join('')}</details>`}
function catalog(){let focus=document.activeElement;let focusKey=focus?.dataset.selectBranch?['branch',focus.dataset.selectBranch]:focus?.dataset.selectSource?['source',focus.dataset.selectSource]:null;let open=[...document.querySelectorAll('#catalog details[open]')].map(x=>x.dataset.group);let sources=[...new Set(groups.map(g=>g.source))];if(mode==='language')$('#catalog').innerHTML=groups.map(branch).join('');else $('#catalog').innerHTML=sources.map((src,i)=>{let children=groups.filter(g=>g.source===src);let items=children.flatMap(g=>g.items);return `<details data-group="source-${i}">${selectionHeader(String(i),src,children.length+' language branches',items,'source')}<div class="branch">${children.map(branch).join('')}</div></details>`}).join('');document.querySelectorAll('#catalog details').forEach(d=>{if(open.includes(d.dataset.group))d.open=true});document.querySelectorAll('.branch-check').forEach(c=>{let items=c.dataset.selectBranch?groups.find(g=>g.id===c.dataset.selectBranch).items:groups.filter(g=>g.source===sources[Number(c.dataset.selectSource)]).flatMap(g=>g.items);let n=items.filter(a=>selected.has(a.id)).length;c.indeterminate=n>0&&n<items.length;c.setAttribute('aria-checked',c.indeterminate?'mixed':String(c.checked));});if(focusKey){let replacement=document.querySelector('[data-select-'+focusKey[0]+'="'+focusKey[1]+'"]');replacement?.focus({preventScroll:true})}$('#stats').textContent=`${groups.length} branches · ${prescriptions.length} prescriptions · ${sources.length} sources`;document.querySelectorAll('[data-mode]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.mode===mode))}

 class=\"card\"><form id=\"project-form\" novalidate><div id=\"details-fields\" class=\"form-grid\"><div class=\"field wide\"><label for=\"project-name\">Project name</label><input id=\"project-name\" name=\"name\" autocomplete=\"off\" placeholder=\"e.g. Customer portal\" required><div class=\"help\">Use a name your whole team can recognize.</div></div><div class=\"field\"><label for=\"project-owner\">Project owner</label><select id=\"project-owner\"><option>James Lee</option><option>Maya Chen</option><option>Olivia Ruiz</option></select></div><div class=\"field\"><label for=\"project-date\">Target date</label><input id=\"project-date\" type=\"date\" value=\"2026-10-16\"></div><div class=\"field wide\"><label for=\"project-description\">Description</label><textarea id=\"project-description\" placeholder=\"What will this project achieve?\"></textarea></div><div class=\"field wide\"><label><input id=\"project-notify\" type=\"checkbox\" checked> Notify the team when this project is created</label></div></div><div id=\"team-fields\" hidden><h2>Workspace access</h2><p class=\"subcopy\">Choose who can see and contribute to this project.</p><div class=\"switch-row\"><span>Team visibility<small>All members of Acme Studio can view this project.</small></span><button type=\"button\" class=\"switch\" role=\"switch\" aria-checked=\"true\" aria-label=\"Team visibility\" data-setting=\"visibility\"></button></div><div class=\"switch-row\"><span>Guest contributions<small>Invited collaborators can comment.</small></span><button type=\"button\" class=\"switch\" role=\"switch\" aria-checked=\"false\" aria-label=\"Guest contributions\" data-setting=\"guests\"></button></div></div><div class=\"form-actions\"><small>Draft \u00b7 not yet shared</small><div><button type=\"button\" data-view=\"projects\">Cancel</button> <button type=\"submit\" class=\"primary\" id=\"save-project\">Create project</button></div></div><div class=\"feedback\" role=\"status\" id=\"form-feedback\"></div></form>< abel+'</div><div><small>Completion</small>'+p.progress+'%</div></div><div class=\"notice\">'+(p.status==='risk'?'Confirm the migration window with the delivery lead.':'The owner has the next milestone in hand.')+'</div>':st.modal==='Kickoff checklist'?'<p>Agree on the scope, assign an owner, set a target date, and confirm what success looks like.</p>':'<div class=\"field\"><label for=\"invite-email\">Email address</label><input id=\"invite-email\" type=\"email\" placeholder=\"name@company.com\"></div>';if(!dlg.open)dlg.showModal()}else if(dlg.open)dlg.close();reportSize()}\nfunction reportSize(){parent.postMessage({type:'lab-size',height:document.querySelector('.app').scrollHeight+24},'*')}\ndocument.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.view){st.view=b.dataset.view;st.feedback=''}if(b.dataset.scope)st.scope=b.dataset.scope;if(b.dataset.editorTab)st.editorTab=b.dataset.editorTab;if(b.dataset.setting)st.settings[b.dataset.setting]=!st.settings[b.dataset.setting];if(b.dataset.open)st.modal=b.dataset.open;if(b.id==='sort')st.sort=!st.sort;if(b.id==='modal-close'||b.id==='modal-dismiss')st.modal=null;if(b.id==='modal-confirm'){st.modal=null;st.toast='Review recorded. Your team is up to date.'}if(b.hasAttribute('data-retry'))st.phase='ready';if(b.hasAttribute('data-clear')){st.search='';st.filter='all';st.scope='all';st.phase='ready'}if(b.id==='save-settings')st.toast='Workspace preferences saved.';if(b.id==='invite')st.modal='Invite teammate';draw();emit()});$('#guide').onclick=e=>{e.preventDefault();st.modal='Kickoff checklist';draw();emit()};$('#project-dialog').addEventListener('cancel',()=>{st.modal=null;emit()});document.addEventListener('input',e=>{let id=e.target.id;if(id==='project-search'){st.search=e.target.value;draw()}if(id==='project-name')st.draft.name=e.target.value;if(id==='project-description')st.draft.description=e.target.value;if(id==='project-date')st.draft.date=e.target.value;emit()});document.addE $('#scene').onchange=e=>{appState.view=e.target.value;appState.feedback='';appState.modal=null;appState.toast='';syncApp()};$('#phase').onchange=e=>{appState.phase=e.target.value;appState.feedback='';appState.toast='';syncApp()};
function render(){active=new Set(prescriptions.filter(a=>selected.has(a.id)&&a.effect).map(a=>a.effect));if(!$('#after').srcdoc)$('#after').srcdoc=content(true);else applyRecipe();$('#count').textContent=`${selected.size} rules · ${active.size} live effects`;$('#changes').textContent=`Your changes (${selected.size})`;catalog();detailsRender()}
function detailsRender(){let chosen=prescriptions.filter(a=>selected.has(a.id));let conflicts=[['serif','type','Type family and hierarchy are independent; compare their combined effect.'],['compact','airy','Density: compact and airy prescribe competing values. Last CSS rule wins.'],['soft','crisp','Geometry: soft and sharp prescribe competing values. Last CSS rule wins.'],['bouncy','weighty','Timing: bouncy and weighty compete. Last CSS rule wins.'],['stack','split','Layout: stacked and asymmetric columns compete. Last CSS rule wins.']].filter(c=>active.has(c[0])&&active.has(c[1]));$('#change-list').innerHTML=(conflicts.length?'<div class="source-note"><b>Competing selections</b>'+conflicts.map(c=>'<p>'+c[2]+'</p>').join('')+'</div>':'')+(chosen.length?chosen.map(a=>{let e=elements.find(e=>e.id===a.effect);return `<div class="change-row"><b>${esc(a.group.name)} · ${esc(a.text.split(':')[0])}</b><small style="display:block">${esc(a.group.source)}</small><p>${esc(a.text)}</p>${e?`<code>${esc(e.name)} · ${esc(e.property)}
${esc(e.css)}</code><small>Workspace example; values demonstrate the prescription and are not exact provider defaults. Shared effects apply once. ${prescriptions.filter(x=>selected.has(x.id)&&x.effect===a.effect).length} selected prescriptions map to this example.</small>`:'<small>Included in export. Requires application context; no visual change simulated.</small>'}</div>`}).join(''):'Select a prescription to begin.');}
$('#before').srcdoc=content(false);render();document.addEventListener('change',ev=>{const c=ev.target;let aggregate=c.dataset.selectBranch?groups.find(g=>g.id===c.dataset.selectBranch)?.items:c.dataset.selectSource!==undefined?groups.filter(g=>g.source===[...new Set(groups.map(g=>g.source))][Number(c.dataset.selectSource)]).flatMap(g=>g.items):null;if(aggregate){aggregate.forEach(a=>c.checked?selected.add(a.id):selected.delete(a.id));render();return}if(ev.target.dataset.action){ev.target.checked?selected.add(ev.target.dataset.action):selected.delete(ev.target.dataset.action);render()}});document.addEventListener('click',ev=>{if(ev.target.dataset.mode){mode=ev.target.dataset.mode;catalog()}if(ev.target.dataset.all){let g=groups.find(g=>g.id===ev.target.dataset.all);let all=g.items.every(a=>selected.has(a.id));g.items.forEach(a=>all?selected.delete(a.id):selected.add(a.id));render()}});document.addEventListener('click',ev=>{if(ev.target.classList.contains('branch-check'))ev.stopPropagation()},true);$('#search').oninput=catalog;$('#reset').onclick=()=>{selected.clear();marked=false;render()};$('#highlight').onclick=()=>{marked=!marked;render()};$('#changes').onclick=()=>{$('#detail').showModal()};$('#export-open').onclick=()=>$('#detail').showModal();$('#close').onclick=()=>$('#detail').close();
const naturalHeights={before:750,after:750};
function fitPreviews(){const mobile=$('#viewport').value==='mobile';const width=mobile?390:800;const height=Math.max(naturalHeights.before,naturalHeights.after);for(const id of ['before','after']){const frame=$('#'+id),stage=frame.parentElement;const scale=Math.min(stage.clientWidth/width,stage.clientHeight/height,1);frame.style.width=width+'px';frame.style.height=height+'px';frame.style.transform=`translate(-50%,-50%) scale(${scale})`;}}
addEventListener('message',e=>{if(e.data?.type!=='lab-size')return;const id=e.source===$('#before').contentWindow?'before':e.source===$('#after').contentWindow?'after':null;if(!id)return;naturalHeights[id]=Number(e.data.height)||620;fitPreviews()});
new ResizeObserver(fitPreviews).observe($('.previews'));$('#viewport').addEventListener('change',fitPreviews);

fitPreviews();$('#export').onclick=()=>{let name=$('#recipe').value.trim()||'My design language';let chosen=prescriptions.filter(a=>selected.has(a.id));let out='# '+name+'\n\n## Selected prescriptions\n'+chosen.map(a=>'- '+a.group.name+' / '+a.group.source+': '+a.text+'\n  Source: '+a.group.url+'\n  Provenance: '+a.group.origin).join('\n')+'\n\n## Lab example CSS\nPreview CSS is calibrated against the Northstar demo workspace. Values are examples, not exact provider defaults. Adapt selectors to the target app.\n\n'+[...active].map(id=>elements.find(e=>e.id===id).css).join('\n')+'\n\n## Implementation instructions\n'+chosen.filter(a=>!a.effect).map(a=>'- '+a.text).join('\n');let a=document.createElement('a'),u=URL.createObjectURL(new Blob([out],{type:'text/markdown'}));a.href=u;a.download=name.replace(/[^a-z0-9]+/gi,'-')+'.md';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);$('#status').textContent='Recipe exported.'};
</script></body></html>
