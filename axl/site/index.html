<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AXL Verb Studio</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect x=%278%27 y=%278%27 width=%2716%27 height=%2716%27 rx=%274%27 fill=%27%23d1175e%27/%3E%3C/svg%3E">
<meta name="description" content="Pick design words and sources, press play, and watch what each one actually changes on the same page.">
<style>
/* Concept: two identical pickers (words, sources) drive one stage. Play walks through either list; the page changes and the tweak board lights up below. */
:root{
  --bg:#f7f7f5;--panel:#ffffff;--ink:#131316;--muted:#5b5d66;--line:#dfe0e4;--soft:#eeeff1;
  --mine:#d1175e;--on-mine:#ffffff;--ok:#0b7a4b;
  --c1:#2a78d6;--c2:#eb6834;--c3:#1baf7a;--c4:#eda100;--c5:#008300;--c6:#4a3aa7;--c7:#e34948;--c8:#0e7c86;--c9:#8a5a2b;--c10:#3949ab;--c11:#5f8a00;--c12:#b0306a;--cx:#8b8e97;
  --cl:.55;--on-c:#ffffff;
  --sans:"Inter Tight","Helvetica Neue",Arial,system-ui,sans-serif;--mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--cl:.74;--on-c:#101114;--bg:#101114;--panel:#17181c;--ink:#f1f1f3;--muted:#a3a6b0;--line:#2b2d34;--soft:#202228;--mine:#ff4f8f;--on-mine:#1a0610;--ok:#4cd694;--c1:#3987e5;--c2:#d95926;--c3:#199e70;--c4:#c98500;--c5:#008300;--c6:#9085e9;--c7:#e66767;--c8:#2fb3bd;--c9:#c08a55;--c10:#7c8cf0;--c11:#8fc23a;--c12:#e0609a;--cx:#6b6e78;color-scheme:dark}}
:root[data-theme="dark"]{--cl:.74;--on-c:#101114;--bg:#101114;--panel:#17181c;--ink:#f1f1f3;--muted:#a3a6b0;--line:#2b2d34;--soft:#202228;--mine:#ff4f8f;--on-mine:#1a0610;--ok:#4cd694;--c1:#3987e5;--c2:#d95926;--c3:#199e70;--c4:#c98500;--c5:#008300;--c6:#9085e9;--c7:#e66767;--c8:#2fb3bd;--c9:#c08a55;--c10:#7c8cf0;--c11:#8fc23a;--c12:#e0609a;--cx:#6b6e78;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 var(--sans);-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:3px solid var(--mine);outline-offset:2px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
kbd{font:600 .75rem var(--mono);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:1px 5px;background:var(--panel)}
.wrap{max-width:1240px;margin:0 auto;padding-inline:clamp(12px,2.4vw,28px)}

/* controls */
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding-block:16px 10px;position:relative}
.pick{display:inline-flex;align-items:stretch;border-radius:16px;background:var(--panel);box-shadow:0 0 0 1px var(--line)}
.pbtn{display:flex;flex-direction:column;align-items:flex-start;justify-content:center;padding:6px 14px 8px;min-height:64px;border-radius:16px 0 0 16px;text-align:left}
.pbtn:hover{background:var(--soft)}
.pbtn small{font:700 .66rem var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.pbtn b{font-size:clamp(1.4rem,2.6vw,2rem);font-weight:800;letter-spacing:-.03em;line-height:1.05;display:flex;align-items:center;gap:8px;max-width:48vw;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.pbtn b i{width:12px;height:12px;border-radius:50%;flex:none;background:var(--cur,var(--ink))}
.play{width:56px;border-left:1px solid var(--line);border-radius:0 16px 16px 0;display:grid;place-items:center}
.play:hover{background:var(--soft)}
.play svg{width:22px;height:22px}
.play[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.times{font:800 1.4rem var(--sans);color:var(--muted)}
.nums{display:flex;gap:18px;margin-left:auto;flex-wrap:wrap}
.nums div{display:flex;flex-direction:column;align-items:flex-end}
.nums b{font-size:1.5rem;font-weight:800;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.nums span{font-size:.72rem;color:var(--muted)}
.nums .zero b{color:var(--mine)}
.pop{position:absolute;left:0;top:calc(100% + 6px);z-index:30;width:min(720px,calc(100vw - 24px));background:var(--panel);border-radius:16px;box-shadow:0 0 0 1px var(--line),0 24px 60px -20px rgba(0,0,0,.4);padding:12px}
.pop[hidden]{display:none}
.pop .ph{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:.82rem;color:var(--muted)}
.pop .ph button{min-height:32px;padding:0 10px;border-radius:99px;border:1.5px solid var(--line);font-weight:600;font-size:.8rem;color:var(--ink)}
.pop .ph .done{margin-left:auto;background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;max-height:min(64svh,560px);overflow:auto}
@media (max-width:560px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}

.tile{min-height:48px;text-align:left;padding:6px 10px;border-radius:10px;background:var(--soft);display:flex;gap:8px;align-items:center;border:2px solid transparent}
.tile i{width:12px;height:12px;border-radius:50%;background:var(--c);flex:none;opacity:.35}
#pickW .tile i,#pickW .pbtn b i{border-radius:3px}
.tile b{font:600 .95rem var(--sans);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.tile>span{min-width:0}.tile span span{font:.7rem var(--mono);color:var(--muted)}
.tile[aria-pressed="true"]{border-color:var(--c);background:var(--panel)}.tile[aria-pressed="true"] i{opacity:1}

/* stage */
.stage{position:relative}
.frame{position:relative;border-radius:14px;overflow:hidden;background:var(--soft);box-shadow:0 0 0 1px var(--line),0 30px 80px -40px rgba(0,0,0,.45);aspect-ratio:980/760;width:100%;height:clamp(340px,calc(100svh - 400px),760px);margin-inline:auto;aspect-ratio:auto;user-select:none;outline:3px solid var(--cur,transparent);outline-offset:-3px}
.frame iframe{position:absolute;left:0;top:0;width:980px;height:760px;border:0;transform-origin:0 0;pointer-events:none}
#pv{transition:opacity .38s ease}
.frame.peeking #pv{opacity:0}.frame.peeking{--cur:var(--ink)}
.state{position:absolute;left:12px;bottom:14px;z-index:3;display:inline-flex;align-items:center;gap:8px;font:700 .9rem var(--sans);padding:8px 14px 8px 11px;border-radius:99px;background:#131316;color:#fff;box-shadow:0 6px 18px rgba(0,0,0,.25);pointer-events:none;max-width:60%}
.state::before{content:"";width:12px;height:12px;border-radius:50%;background:var(--cur,#fff);flex:none}
.state span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.frame.peeking .state{background:#fff;color:#131316;box-shadow:0 0 0 2px #131316}.frame.peeking .state::before{background:#131316}
.nothing{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:3;max-width:min(440px,80%);background:#131316;color:#fff;border-radius:16px;padding:14px 18px;text-align:center;font-size:.95rem;box-shadow:0 20px 50px rgba(0,0,0,.35)}
.nothing b{display:block;font-size:1.15rem;margin-bottom:4px}
.nothing{pointer-events:auto}
.marks{position:absolute;right:12px;top:12px;z-index:3;min-height:36px;padding:0 12px;border-radius:99px;background:#fff;color:#131316;font-weight:700;font-size:.8rem;box-shadow:0 0 0 2px var(--cur,#131316),0 6px 16px rgba(0,0,0,.18)}
.marks[aria-pressed="false"]{box-shadow:0 0 0 1px #c9cbd1;color:#5b5d66}
.frame.peeking .marks{visibility:hidden}
.hold{position:absolute;right:12px;bottom:14px;z-index:3;min-height:44px;padding:0 16px;border-radius:99px;background:rgba(19,19,22,.86);color:#fff;font-weight:700;font-size:.88rem;display:inline-flex;align-items:center;gap:8px;box-shadow:0 8px 24px rgba(0,0,0,.3);touch-action:none}
.hold kbd{background:transparent;color:#fff;border-color:rgba(255,255,255,.5)}
.frame.peeking .hold{background:#fff;color:#131316}.frame.peeking .hold kbd{color:#131316;border-color:#131316}
.steps{display:flex;gap:6px;margin:0 0 10px;min-height:38px;align-items:center;overflow-x:auto;scrollbar-width:none;scroll-behavior:smooth}
.steps::-webkit-scrollbar{display:none}
.steps .hint{font-size:.88rem;color:var(--muted)}
.stop{flex:none;min-height:34px;padding:0 12px 0 9px;border-radius:99px;display:inline-flex;align-items:center;gap:7px;font-weight:600;font-size:.86rem;background:var(--panel);box-shadow:0 0 0 1px var(--line);color:var(--muted);transition:background .3s,color .3s,box-shadow .3s,transform .3s}
.stop i{width:10px;height:10px;border-radius:50%;background:var(--c)}
.stop.done{opacity:.55}
.stop.on{background:var(--c);color:var(--on-c);box-shadow:0 6px 16px -6px var(--c);transform:scale(1.06)}
.stop.on i{background:var(--on-c)}
@keyframes lit{0%{background:color-mix(in srgb,var(--cur,var(--ink)) 22%,transparent)}100%{background:transparent}}
.tw.fresh{animation:lit 1.2s ease-out}
.says{min-height:1.5em;margin:8px 2px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:.98rem;color:var(--muted)}
.says q{color:var(--ink);font-weight:600}.says a{color:inherit;font:.78rem var(--mono)}

/* board */
.boardh{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:14px 0 8px;flex-wrap:wrap}
.boardh h2{margin:0;font-size:1.3rem;letter-spacing:-.02em}
.boardh span{font-size:.82rem;color:var(--muted)}
.bfilter{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.srch input{min-height:44px;width:min(420px,80vw);border-radius:99px;border:1.5px solid var(--line);background:var(--panel);padding:0 16px;font:inherit}
.seg{display:inline-flex;border-radius:99px;box-shadow:0 0 0 1.5px var(--line);overflow:hidden;background:var(--panel)}
.seg button{min-height:40px;padding:0 14px;font-weight:600;font-size:.85rem;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.bcount{font-size:.82rem;color:var(--muted)}
.col h3 button{all:unset;cursor:pointer}
.col.closed .tw{display:none}
.tw.hide{display:none}
.more{margin:2px 6px 6px 23px;padding:8px 10px;border-radius:8px;background:var(--soft);font-size:.82rem;color:var(--ink)}
.more q{display:block;margin:0 0 6px}.more q::before,.more q::after{content:none}
.more small{display:block;font:.7rem var(--mono);color:var(--muted);margin-top:-3px;margin-bottom:6px}
.more .add{min-height:32px;padding:0 12px;border-radius:99px;background:var(--mine);color:var(--on-mine);font-weight:700;font-size:.8rem}
.tw .ex{font:700 .75rem var(--mono);color:var(--muted);padding:0 4px}
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px;align-items:start}
.col{background:var(--panel);border-radius:14px;box-shadow:0 0 0 1px var(--line);padding:10px 10px 8px}
.col h3{margin:2px 4px 6px;font:700 .68rem var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between}
.tw{width:100%;min-height:30px;display:flex;align-items:center;gap:8px;padding:4px 6px;border-radius:8px;text-align:left;font-size:.86rem;color:var(--muted);transition:background .25s,color .25s}
.tw:hover{background:var(--soft)}
.tw .d{width:9px;height:9px;border-radius:50%;background:var(--line);flex:none;transition:background .25s,transform .25s}
.tw .nm{flex:1}
.tw .ck{color:var(--ok);font-size:.75rem}
.tw .nv{font:600 .62rem var(--mono);letter-spacing:.04em;text-transform:uppercase;color:var(--muted);border:1px dashed var(--line);border-radius:4px;padding:1px 4px}
.tw .ct{font:700 .7rem var(--mono);color:var(--muted);min-width:2.6em;text-align:right}
.tw.lit{color:var(--ink);font-weight:650}
.tw.lit .d{background:var(--cur,var(--ink));transform:scale(1.35)}
.tw.any .d{background:var(--muted)}
.tw.lit.any .d{background:var(--cur,var(--ink))}
.tw[aria-pressed="true"] .nm{color:var(--mine);font-weight:750}
.tw[aria-pressed="true"] .nm::after{content:" ●";font-size:.7em}

/* tray */
.tray{position:sticky;bottom:0;z-index:5;margin-top:18px;background:var(--panel);border-radius:14px 14px 0 0;box-shadow:0 -1px 0 var(--line),0 -16px 40px -30px rgba(0,0,0,.4);padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.tray .name{display:flex;align-items:center;gap:6px;font-weight:800;font-size:1.2rem;letter-spacing:-.02em}
.tray input{width:8.5em;border:0;border-bottom:2px solid var(--mine);background:transparent;font-weight:800;letter-spacing:-.02em;padding:2px 0}
.tray .facts{font-size:.9rem;color:var(--muted);flex:1;min-width:220px}
.tray .facts b{color:var(--ink)}.tray .facts .m{color:var(--mine);font-weight:700}
.btn{min-height:44px;padding:0 18px;border-radius:99px;font-weight:700;border:1.5px solid var(--line)}
.btn.small{min-height:34px;padding:0 12px}
.btn.primary{background:var(--mine);color:var(--on-mine);border-color:var(--mine)}
.btn:disabled{opacity:.4;cursor:default}
.sheet{position:fixed;inset:auto 0 0 0;margin:auto;z-index:40;width:min(680px,100%);background:var(--panel);border-radius:18px 18px 0 0;box-shadow:0 -20px 60px rgba(0,0,0,.35);padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));transform:translateY(105%);transition:transform .35s cubic-bezier(.2,.9,.25,1);max-height:88svh;overflow:auto}
.sheet.open{transform:none}.sheet:not(.open){visibility:hidden;transition:transform .35s,visibility 0s .35s}
.sheet h2{margin:0 0 4px;font-size:1.4rem;letter-spacing:-.02em}
.sheet p{margin:0 0 10px;color:var(--muted)}
pre{margin:0 0 10px;background:var(--soft);border-radius:10px;padding:12px;overflow:auto;font:.8rem/1.45 var(--mono);max-height:260px}
.row2{display:flex;gap:8px;flex-wrap:wrap}
.sheet{width:min(860px,100%)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:8px 0 8px;overflow-x:auto}
.tabs button{min-height:44px;padding:0 12px;font-weight:600;font-size:.9rem;color:var(--muted);white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);box-shadow:inset 0 -3px 0 var(--mine)}
.tabnote{font-size:.88rem}
#out{max-height:50svh;white-space:pre-wrap}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:39;opacity:0;pointer-events:none;transition:opacity .3s}.scrim.open{opacity:1;pointer-events:auto}
.below{padding-block:64px 80px;display:grid;grid-template-columns:minmax(0,1fr);gap:18px}
.below h2{font-size:clamp(1.5rem,3vw,2.2rem);letter-spacing:-.03em;margin:0}
.below .sub{color:var(--muted);margin:0}
.vague{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.vague blockquote{margin:0;background:var(--panel);border-radius:12px;box-shadow:0 0 0 1px var(--line);padding:12px 14px;font-size:.92rem}
.vague cite{display:block;margin-top:6px;font:.72rem var(--mono);color:var(--muted);font-style:normal}
.foot{color:var(--muted);font:.8rem var(--mono);text-align:center}
@media (max-width:760px){.frame{height:auto;aspect-ratio:980/760}.says{white-space:normal}.nums{margin-left:0}.nums div{align-items:flex-start}.times{display:none}.frame{max-height:none}.hold kbd{display:none}.state{max-width:52%}
  .tray{gap:8px;padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px))}.tray .facts{flex-basis:100%;order:3;font-size:.82rem;min-width:0}.tray input{width:6.5em}.tray .btn{min-height:40px;padding:0 14px}}
@media (hover:none){.hold kbd{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="bar">
    <div class="pick" id="pickW">
      <button class="pbtn" type="button" data-axis="w" aria-haspopup="true" aria-expanded="false"><small>Commands</small><b><i></i><span class="lab"></span></b></button>
      <button class="play" type="button" data-play="w" aria-pressed="false" aria-label="Play through the commands"></button>
      <div class="pop" hidden data-pop="w"></div>
    </div>
    <span class="times" aria-hidden="true">×</span>
    <div class="pick" id="pickS">
      <button class="pbtn" type="button" data-axis="s" aria-haspopup="true" aria-expanded="false"><small>Sources</small><b><i></i><span class="lab"></span></b></button>
      <button class="play" type="button" data-play="s" aria-pressed="false" aria-label="Play through the sources"></button>
      <div class="pop" hidden data-pop="s"></div>
    </div>
    <div class="nums" id="nums" aria-live="polite"></div>
  </header>

  <section class="stage" aria-label="The demo page">
    <div class="steps" id="steps" role="group" aria-label="Play order"></div>
    <div class="frame" id="frame">
      <iframe id="pv0" title="Demo page, original" tabindex="-1" aria-hidden="true"></iframe>
      <iframe id="pv" title="Demo page with the current selection applied" tabindex="-1"></iframe>
      <span class="state" id="state"><span id="stateTxt"></span></span>
      <div class="nothing" id="nothing" hidden></div>
      <button class="marks" id="marksBtn" type="button" aria-pressed="true">Outline changes · <span id="marks"></span></button>
      <button class="hold" id="hold" type="button" aria-label="Hold to see the original"><kbd>Shift</kbd> hold for original</button>
    </div>
    <p class="says" id="says" aria-live="polite"></p>
  </section>

  <section aria-labelledby="bh">
    <div class="boardh"><h2 id="bh">Every tweak, lighting up</h2><span id="bsub"></span></div>
    <div class="bfilter"><label class="srch"><span class="sr">Search tweaks and rules</span><input id="q" type="search" placeholder="Search tweaks and source rules…" autocomplete="off"></label>
      <div class="seg" role="group" aria-label="Show"><button type="button" data-f="all" aria-pressed="true">All</button><button type="button" data-f="lit" aria-pressed="false">Lit now</button><button type="button" data-f="checked" aria-pressed="false">Tool-checked</button><button type="button" data-f="mine" aria-pressed="false">Yours</button></div>
      <span class="bcount" id="bcount"></span></div>
    <div class="board" id="board"></div>
  </section>

  <footer class="tray" aria-label="Your word">
    <div class="name">my <input id="myName" aria-label="Name of your word" value="polish" maxlength="24"></div>
    <div class="facts" id="facts" aria-live="polite"></div>
    <button class="btn" id="clear" type="button">Clear</button>
    <button class="btn primary" id="save" type="button">Get my word</button>
  </footer>

  <main class="below">
    <h2 id="bigNo"></h2>
    <p class="sub" id="vagueSub"></p>
    <div class="vague" id="vague"></div>
    <p class="foot" id="foot"></p>
  </main>
</div>

<div class="scrim" id="scrim"></div>
<aside class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" inert>
  <h2 id="sheetTitle"></h2>
  <p id="sheetSub"></p>
  <div class="tabs" role="tablist">
    <button role="tab" type="button" data-t="prompt" aria-selected="true">1 · Give it to your agent</button>
    <button role="tab" type="button" data-t="script" aria-selected="false">2 · Check any page</button>
    <button role="tab" type="button" data-t="file" aria-selected="false">3 · Definition file</button>
  </div>
  <p class="tabnote" id="tabNote"></p>
  <pre id="out" tabindex="0"></pre>
  <div class="row2"><button class="btn primary" id="cp" type="button">Copy</button><button class="btn" id="dl" type="button">Download</button><button class="btn" id="close" type="button">Close</button></div>

<script>

  $('#clear').addEventListener('click', () => { st.mine.clear(); st.mineView = false; render(true); });

  const renderPicks = () => { renderPick('w'); renderPick('s'); };
  function render(flash) {
    const cur = current(); frame.style.setProperty('--cur', cur.color); document.documentElement.style.setProperty('--cur', cur.color);
    if (!st.peek && !st.blink) { paint(cur); }
    if (!st.peek) $('#stateTxt').textContent = cur.label;
    const vis = cur.tweaks.filter(i => T[i].css).length, inv = cur.tweaks.length - vis, nb = $('#nothing');
    nb.hidden = st.peek || st.mineView || vis > 0;
    const srcOnly = st.sel.s.size === 1 || st.walk === 's' ? (st.walk === 's' ? walkItems('s')[st.idx % Math.max(1, walkItems('s').length)] : [...st.sel.s][0]) : null;
    if (!nb.hidden && !cur.entries.length && srcOnly) { const ws = [...new Set(D.entries.filter(e => e.src === srcOnly).map(e => e.word))];
      nb.innerHTML = `<b>${esc(srcOnly)} doesn't use ${st.sel.w.size === 1 ? `“${esc([...st.sel.w][0])}”` : 'these commands'}</b>It uses: ${ws.map(esc).join(', ')}.<br><button class="btn small" id="useIts" type="button" style="margin-top:10px;background:#fff;color:#131316">Show ${esc(srcOnly)}'s commands</button>`; }
    else if (!nb.hidden) nb.innerHTML = cur.tweaks.length ? `<b>Nothing to see</b>This definition asks for ${inv} change${inv > 1 ? 's' : ''} a page can't show: ${cur.tweaks.map(i => esc(T[i].name.toLowerCase())).join(', ')}.` : `<b>Nothing to see</b>This definition names no concrete change at all.`;
    renderPicks();
    // walk progress
    const items = st.walk ? walkItems(st.walk) : [], k = items.length ? st.idx % items.length : 0;
    $('#steps').innerHTML = items.length ? items.map((n, i) => `<button class="stop${i === k ? ' on' : i < k ? ' done' : ''}" type="button" data-j="${i}" style="--c:${color(st.walk, n)}"><i style="border-radius:${st.walk === 'w' ? '3px' : '50%'}"></i>${esc(n)}</button>`).join('')
      : `<span class="hint">Press ▶ on Commands or Sources to play through them.</span>`;
    const on = $('#steps .stop.on'); if (on) $('#steps').scrollLeft = on.offsetLeft - $('#steps').clientWidth / 2 + on.offsetWidth / 2;
    // numbers for the whole selection: the lack of a standard, counted
    const sel = D.entries.filter(inSel), union = new Set(sel.flatMap(e => e.tweaks)), n = sel.length;
    const cnt = id => sel.filter(e => e.tweaks.includes(id)).length, allShared = n > 1 ? [...union].filter(i => cnt(i) === n).length : null;
    const indep = new Set(sel.map(e => e.derives_from || e.src)).size;
    $('#nums').innerHTML = `<div><b>${n}</b><span>definitions</span></div><div><b>${indep}</b><span>independent</span></div><div><b>${union.size}</b><span>tweaks</span></div>` + (allShared != null ? `<div class="${allShared ? '' : 'zero'}"><b>${allShared}</b><span>shared by all</span></div>` : '');
    // board
    const lit = new Set(cur.tweaks);
    $$('#board .tw').forEach(b => { const id = b.dataset.id, c = cnt(id), was = b.classList.contains('lit'); if (lit.has(id) && !was) { b.classList.remove('fresh'); void b.offsetWidth; b.classList.add('fresh'); } b.classList.toggle('lit', lit.has(id)); b.classList.toggle('any', c > 0); b.setAttribute('aria-pressed', st.mine.has(id)); b.querySelector('.ct').textContent = c ? `${c}/${n}` : ''; });
    $('#bsub').textContent = `${lit.size} lit for ${cur.label.replace(/[“”]/g, '')} · counts show how many of the ${n} selected definitions ask for each`;
    // quote
    const e = cur.entries.length === 1 ? cur.entries[0] : cur.entries.find(x => x.quote);
    const visTxt = cur.tweaks.length ? ` <span style="font:.78rem var(--mono)">${vis} of ${cur.tweaks.length} tweaks visible</span>` : '';
    $('#says').innerHTML = st.mineView ? `Your ${esc($('#myName').value || 'word')}: ${st.mine.size} tweak${st.mine.size === 1 ? '' : 's'}.` : e && e.quote ? `${esc(e.src)} on “${esc(e.word)}”: <q>${esc(e.quote)}</q> <a href="${esc(e.url)}" target="_blank" rel="noopener noreferrer">source</a>${visTxt}` : `${cur.tweaks.length} tweaks from ${cur.entries.length} definitions.${visTxt}`;
    facts(); if (typeof filterBoard === 'function' && bf !== 'all') filterBoard();
  }

  /* ---- save: three outputs ---- */
  const sheet = $('#sheet'), scrim = $('#scrim');
  const slug = s => (s || 'word').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'word';
  let OUT = {}, tab = 'prompt';
  const chosen = () => st.mine.size ? [...st.mine] : current().tweaks;
  function build() {
    const name = ($('#myName').value.trim() || 'my word'), ids = chosen(), f = slug(name);
    const ts = ids.map(i => T[i]).filter(Boolean), auto = ts.filter(t => t.check), judge = ts.filter(t => !t.check);
    const prov = t => (t.asks || []).map(a => `     - ${a.src}: "${a.quote.replace(/\s+/g, ' ').slice(0, 160)}"${a.verified ? '' : ' (paraphrase)'} — ${a.url}`).join('\n') || '     - (no source quote on record)';
    const prompt = `# ${name}\n\nApply exactly these ${ts.length} changes to the UI. Do not redesign anything else.\n` +
      ts.map((t, i) => `\n${i + 1}. ${t.name}  [${t.category}]\n   Change:\n${t.css ? t.css.replace(/\}/g, '}\n').split('\n').filter(Boolean).map(l => '     ' + l).join('\n') : '     (no CSS: ' + (t.check ? 'behaviour/markup change, verified by the check below' : 'needs judgment; describe what you changed') + ')'}\n   Check: ${t.check ? t.check : 'manual review'}\n   Who asks for it:\n${prov(t)}`).join('\n') +
      `\n\nWhen done, run the check script (tab 2) on the page and fix every FAIL it reports. Repeat until it reports 0 failures.\n`;
    const checks = [...new Set(auto.map(t => t.check))];
    const script = CHECK_SCRIPT(name, checks, auto.map(t => ({ id: t.id, name: t.name, check: t.check })));
    const file = { axl_verb: '0.1', name, tweaks: ids, checks: auto.map(t => ({ tweak: t.id, check: t.check })), judgment: judge.map(t => t.name),
      provenance: Object.fromEntries(ts.map(t => [t.id, (t.asks || []).map(a => ({ source: a.src, quote: a.quote, url: a.url }))])) };
    OUT = { prompt: { text: prompt, file: `${f}.prompt.md`, note: `Paste this into Claude Code, Cursor or any agent. Every change lists its exact CSS and who asks for it.` },
      script: { text: script, file: `${f}.check.js`, note: `Open your page, press F12, paste into the Console. It prints PASS/FAIL per check with the elements that fail, and copies a report you can hand back to your agent. Or from the repo: python3 axl/axl.py check ${f}.axl.json yourpage.html` },
      file: { text: JSON.stringify(file, null, 2), file: `${f}.axl.json`, note: `The whole definition: tweaks, checks, and provenance. python3 axl/axl.py check ${f}.axl.json yourpage.html runs it.` } };
    $('#sheetTitle').textContent = name; $('#sheetSub').textContent = `${ts.length} tweaks · ${auto.length} checked automatically · ${judge.length} need a person`;
  }
  function showTab(k) { tab = k; $$('.tabs button').forEach(b => b.setAttribute('aria-selected', b.dataset.t === k)); $('#out').textContent = OUT[k].text; $('#tabNote').textContent = OUT[k].note; }
  $$('.tabs button').forEach(b => b.addEventListener('click', () => showTab(b.dataset.t)));
  $('#save').addEventListener('click', () => { stopWalk(); build(); showTab('prompt'); sheet.inert = false; sheet.classList.add('open'); scrim.classList.add('open'); $('#cp').focus(); });
  const closeSheet = () => { sheet.classList.remove('open'); scrim.classList.remove('open'); sheet.inert = true; $('#save').focus(); };
  $('#close').addEventListener('click', closeSheet); scrim.addEventListener('click', closeSheet);
  const copy = (t, b) => { const o = b.textContent, ok = () => { b.textContent = 'Copied'; setTimeout(() => b.textContent = o, 1200); };
    try { navigator.clipboard.writeText(t).then(ok, () => { const r = document.createRange(); r.selectNodeContents($('#out')); getSelection().removeAllRanges(); getSelection().addRange(r); b.textContent = 'Selected: press Ctrl+C'; }); } catch (e) { ok(); } };
  $('#cp').addEventListener('click', e => copy(OUT[tab].text, e.currentTarget));
  $('#dl').addEventListener('click', () => { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([OUT[tab].text], { type: 'text/plain' })); a.download = OUT[tab].file; document.body.appendChild(a); a.click(); a.remove(); });

  /* a self-contained check that runs in any page's DevTools console */
  function CHECK_SCRIPT(name, checks, tweaks) {
    return `/* AXL check: ${name}. Paste into the DevTools console of the page you want to check. */
(() => {
  const TWEAKS = ${JSON.stringify(tweaks)};
  const vis = e => { const r = e.getBoundingClientRect(); return r.width > 0 && r.height > 0 && getComputedStyle(e).visibility !== 'hidden'; };
  const sel = e => e.id ? '#' + e.id : e.tagName.toLowerCase() + (typeof e.className === 'string' && e.className.trim() ? '.' + e.className.trim().split(/\\s+/)[0] : '');
  const rgb = s => (s.match(/[\\d.]+/g) || [0, 0, 0, 1]).map(Number);
  const lum = ([r, g, b]) => { const f = x => { x /= 255; return x <= 0.03928 ? x / 12.92 : ((x + 0.055) / 1.055) ** 2.4; }; return 0.2126 * f(r) + 0.7152 * f(g) + 0.0722 * f(b); };
  const bg = e => { for (let n = e; n; n = n.parentElement) { const c = rgb(getComputedStyle(n).backgroundColor); if (c.length < 4 || c[3] > 0) return c; } return [255, 255, 255]; };
  const all = [...document.querySelectorAll('body *')].filter(vis);
  const text = all.filter(e => [...e.childNodes].some(n => n.nodeType === 3 && n.textContent.trim()));
  const C = {
    'contrast': () => text.filter(e => { const s = getComputedStyle(e), a = lum(rgb(s.color)), b = lum(bg(e)), r = (Math.max(a, b) + .05) / (Math.min(a, b) + .05), big = parseFloat(s.fontSize) >= 24 || (parseFloat(s.fontSize) >= 18.66 && +s.fontWeight >= 700); return r < (big ? 3 : 4.5); }).map(e => sel(e) + ' contrast too low'),
    'target-44': () => all.filter(e => e.matches('button,a[href],input:not([type=hidden]),select,textarea,[role=button]')).filter(e => { const r = e.getBoundingClientRect(); return r.width < 44 || r.height < 44; }).map(e => { const r = e.getBoundingClientRect(); return sel(e) + ' is ' + Math.round(r.width) + 'x' + Math.round(r.height); }),
    'spacing-4': () => all.flatMap(e => { const s = getComputedStyle(e); return ['paddingTop','paddingLeft','marginTop','marginBottom','rowGap','columnGap'].filter(p => { const v = parseFloat(s[p]); return v && isFinite(v) && Math.round(v * 100) % 400; }).map(p => sel(e) + ' ' + p + ' ' + s[p]); }),
    'body-16': () => text.filter(e => e.matches('p,li,td,label,input,select,textarea') && parseFloat(getComputedStyle(e).fontSize) < 14).map(e => sel(e) + ' ' + getComputedStyle(e).fontSize),
    'leading-1.5': () => text.filter(e => e.matches('p') && e.textContent.trim().length > 40).filter(e => { const s = getComputedStyle(e); return (s.lineHeight === 'normal' ? 1.2 : parseFloat(s.lineHeight) / parseFloat(s.fontSize)) < 1.5; }).map(e => sel(e) + ' line-height too tight'),
    'measure-80': () => text.filter(e => e.matches('p,li') && e.textContent.length > 80 && e.getBoundingClientRect().width / (parseFloat(getComputedStyle(e).fontSize) * .5) > 80).map(e => sel(e) + ' lines longer than 80 characters'),
    'reflow-320': () => document.documentElement.scrollWidth > innerWidth + 1 ? ['page scrolls sideways at ' + innerWidth + 'px (resize to 320px and re-run)'] : [],
    'duration-500': () => all.filter(e => Math.max(...getComputedStyle(e).transitionDuration.split(',').map(v => parseFloat(v) * (v.includes('ms') ? 1 : 1000))) > 500).map(e => sel(e) + ' transition over 500ms'),
    'no-gradient': () => all.filter(e => /gradient/.test(getComputedStyle(e).backgroundImage)).map(e => sel(e) + ' uses a gradient'),
    'banned-fonts': () => [...new Set(all.filter(e => e.matches('h1,h2,h3')).map(e => getComputedStyle(e).fontFamily.split(',')[0].replace(/["']/g, '').trim()))].filter(f => /^(inter|roboto|arial|open sans|lato|system-ui|space grotesk)$/i.test(f)).map(f => 'headings use ' + f),
    'reduced-motion': () => { let ok = false; for (const s of document.styleSheets) { try { for (const r of s.cssRules) if (r.media && /prefers-reduced-motion/.test(r.media.mediaText)) ok = true; } catch (e) {} } return ok ? [] : ['no prefers-reduced-motion rule found']; },
    'focus-visible': () => { const bad = []; for (const s of document.styleSheets) { try { for (const r of s.cssRules) if (r.selectorText && /:focus(?!-visible)/.test(r.selectorText) && /outline:\\s*(none|0)/.test(r.cssText)) bad.push(r.selectorText + ' removes the focus outline'); } catch (e) {} } return bad; },
  };
  const rows = TWEAKS.map(t => { const f = C[t.check]; if (!f) return { tweak: t.name, check: t.check, result: 'SKIP', details: 'run with axe-core / the axl CLI' }; const fails = f(); return { tweak: t.name, check: t.check, result: fails.length ? 'FAIL' : 'PASS', count: fails.length, details: fails.slice(0, 12).join('; ') }; });
  console.table(rows);
  const report = '# AXL report: ${name}\\n' + rows.map(r => '- ' + r.result + ' ' + r.tweak + (r.count ? ' (' + r.count + '): ' + r.details : '')).join('\\n');
  try { copy(report); console.log('Report copied. Paste it to your agent and ask it to fix every FAIL.'); } catch (e) { console.log(report); }
  return rows.filter(r => r.result === 'FAIL').length + ' failing checks';
})();`;
  }

  $('#bigNo').textContent = `${D.stats.sources} sources. ${D.stats.words} commands. ${D.stats.tweaks} tweaks. No standard.`;
  $('#vagueSub').textContent = `${D.stats.vague} statements name no concrete change at all. These are the ones an agent has to guess.`;
  $('#vague').innerHTML = D.vague.slice(0, 9).map(v => `<blockquote>${esc(v.text)}<cite>${esc(v.src)} · “${esc(v.word)}”${v.verified ? '' : ' · paraphrase, not verified'}</cite></blockquote>`).join('');
  $('#foot').textContent = 'Quotes are verbatim from fetched pages. Which tweaks a statement asks for is model-assisted and open to challenge. Checks run with python3 axl/axl.py.';

  // open: polish, all sources, walking through the sources
  if (!reduced) startWalk('s');
  render(false); filterBoard();
  window.axlReady = true;
})();
</script>
</body>
</html>
