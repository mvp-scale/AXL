<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AXL — polish, measured</title>
<meta name="description" content="One design word, three meanings. Measured, it becomes something a tool can check.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect x=%277%27 y=%277%27 width=%2718%27 height=%2718%27 fill=%27none%27 stroke=%27%230a5cff%27 stroke-width=%274%27 transform=%27rotate(45 16 16)%27/%3E%3C/svg%3E">
<style>
/* Concept: one word, one page, five scenes. The visitor touches things; the page answers. Words are labels, never explanation.
   Palette: paper + graphite ink, one measuring-blue accent, pass/fail only where a number is judged. Type: system grotesk, heavy and tight; mono for numbers. */
:root{
  --paper:#f2f3f5;--card:#ffffff;--ink:#0d1117;--muted:#525c69;--line:#d5dae1;--accent:#0a5cff;--on-accent:#ffffff;
  --pass:#0a7d4a;--fail:#c4310c;--dim:#e3e6ea;--wall:#0d1117;--wall-ink:#eef1f5;--wall-dim:#1a212b;--wall-muted:#9aa6b4;--glow:#5b93ff;
  --sans:"SF Pro Display","Helvetica Neue","Segoe UI Variable Display","Segoe UI",system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --gut:clamp(16px,4vw,48px);
}
@media (prefers-color-scheme:dark){:root{
  --paper:#0b0f14;--card:#141a22;--ink:#eef1f5;--muted:#a3aebb;--line:#27303b;--accent:#6ea0ff;--on-accent:#04122e;
  --pass:#4fd09a;--fail:#ff8f6b;--dim:#1a212b;--wall:#05080c;--wall-dim:#121922;--glow:#6ea0ff;color-scheme:dark}}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-snap-type:y proximity}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.4 var(--sans);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.scene{min-height:100svh;padding:clamp(56px,8vh,96px) var(--gut);scroll-snap-align:start;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px}
.mark{background:var(--paper);padding:6px 12px 6px 10px;border-radius:99px;box-shadow:0 0 0 1px var(--line);position:fixed;left:var(--gut);top:16px;z-index:30;display:flex;align-items:center;gap:8px;font-weight:800;letter-spacing:.14em;font-size:.85rem;color:var(--ink);text-decoration:none}
.mark i{width:14px;height:14px;border:3px solid var(--accent);border-radius:3px;transform:rotate(45deg);display:block}
.dots{position:fixed;right:14px;top:50%;transform:translateY(-50%);z-index:30;display:flex;flex-direction:column;gap:2px}
.dots a{width:28px;height:28px;display:grid;place-items:center}
.dots a i{width:9px;height:9px;border-radius:50%;background:var(--muted);opacity:.45;transition:transform .2s,opacity .2s}
.dots a[aria-current="true"] i{opacity:1;transform:scale(1.5);background:var(--accent)}

/* Scene 1 — the word */
.hero{background:var(--paper)}
.word{font-size:clamp(4.5rem,21vw,17rem);font-weight:800;letter-spacing:-.05em;line-height:.9;margin:0;text-align:center;transition:transform .7s cubic-bezier(.2,.8,.2,1)}
.hero.split .word{transform:translateY(-3vh) scale(.62)}
.means{display:flex;gap:clamp(10px,2.4vw,28px);flex-wrap:wrap;justify-content:center;min-height:9.5rem;width:100%;max-width:980px}
.mean{flex:1 1 200px;max-width:300px;background:var(--card);border:2px solid transparent;border-radius:22px;padding:18px 16px 16px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;opacity:0;transform:translateY(-40px) scale(.7);box-shadow:0 1px 0 var(--line),0 12px 32px -18px rgba(13,17,23,.35)}
.hero.split .mean{opacity:1;transform:none;transition:opacity .5s ease,transform .7s cubic-bezier(.2,.9,.25,1.15)}
.hero.split .mean:nth-child(2){transition-delay:.12s}.hero.split .mean:nth-child(3){transition-delay:.24s}
.mean svg{width:64px;height:64px;color:var(--accent)}
.mean b{font-size:1.35rem;letter-spacing:-.02em}
.mean[aria-pressed="true"]{border-color:var(--accent)}
.mean:hover{border-color:var(--line)}.mean[aria-pressed="true"]:hover{border-color:var(--accent)}
.said{min-height:5.2rem;max-width:760px;text-align:center;color:var(--muted);font-size:1.05rem}
.said q{color:var(--ink);font-weight:600}.said small{display:block;font-family:var(--mono);font-size:.78rem;margin-top:6px}
.cta{text-decoration:none;display:inline-flex;align-items:center;gap:10px;background:var(--ink);color:var(--paper);font-weight:700;font-size:1.15rem;border-radius:99px;padding:16px 30px;min-height:56px;opacity:0;transform:translateY(8px);transition:opacity .5s .5s,transform .5s .5s}
.hero.split .cta{opacity:1;transform:none}
.cta svg{width:18px;height:18px;animation:bob 1.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(4px)}}

/* Scene 2 — the stage */
.stagewrap{width:100%;max-width:min(1180px,calc((100svh - 230px)*1.29));position:relative}
.counter{position:absolute;left:0;top:-4px;transform:translateY(-100%);display:flex;align-items:baseline;gap:10px;font-variant-numeric:tabular-nums}
.counter b{font-size:clamp(2.6rem,7vw,4.6rem);font-weight:800;letter-spacing:-.04em;line-height:1;color:var(--fail);transition:color .3s}
.counter.zero b{color:var(--pass)}
.counter span{font-size:.95rem;color:var(--muted)}
.stage{position:relative;aspect-ratio:var(--ar,980/760);width:100%;background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 30px 80px -40px rgba(13,17,23,.55),0 0 0 1px var(--line);touch-action:pan-y;user-select:none}
.layer{position:absolute;inset:0;overflow:hidden}
.layer iframe{position:absolute;left:0;top:0;width:980px;height:760px;border:0;transform-origin:0 0;pointer-events:none;background:#fff}
.after{clip-path:inset(0 calc(100% - var(--p,0%)) 0 0)}
.handle{position:absolute;top:0;bottom:0;left:var(--p,0%);width:44px;margin-left:-22px;display:grid;place-items:center;cursor:ew-resize;z-index:5}
.handle::before{content:"";position:absolute;top:0;bottom:0;width:3px;background:var(--accent);left:50%;margin-left:-1.5px}
.handle span{position:relative;width:44px;height:44px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;box-shadow:0 6px 18px rgba(10,92,255,.5)}
.handle svg{width:22px;height:22px}
.lbl{position:absolute;top:10px;z-index:4;font:700 .72rem var(--mono);letter-spacing:.08em;text-transform:uppercase;padding:4px 9px;border-radius:99px;background:rgba(13,17,23,.78);color:#fff}
.lbl.a{left:10px}.lbl.b{right:10px}
.pin{position:absolute;z-index:6;width:38px;height:38px;margin:-19px 0 0 -19px;border-radius:50%;background:var(--accent);color:var(--on-accent);font-weight:800;display:grid;place-items:center;box-shadow:0 0 0 3px #fff,0 8px 20px rgba(10,92,255,.55);transform:scale(0);transition:transform .35s cubic-bezier(.2,1.4,.4,1)}
.pin.on{transform:scale(1)}
.pin.on::after{content:"";position:absolute;inset:-3px;border-radius:50%;border:2px solid var(--accent);animation:ping 1.8s ease-out infinite;opacity:0}
.stage.seen .pin.on::after{animation:none}
@keyframes ping{0%{transform:scale(1);opacity:.9}100%{transform:scale(1.9);opacity:0}}
.pin[aria-expanded="true"]{background:var(--ink);color:var(--paper)}
.hint2{color:var(--muted);font-size:.95rem;min-height:1.4em;text-align:center}

#s2{padding-top:clamp(96px,14vh,130px)}
/* the lens */
.lens{position:fixed;z-index:40;left:50%;bottom:0;transform:translate(-50%,110%);width:min(560px,100%);background:var(--card);border-radius:24px 24px 0 0;box-shadow:0 -20px 60px rgba(0,0,0,.35);padding:20px clamp(16px,4vw,28px) calc(20px + env(safe-area-inset-bottom,0px));transition:transform .45s cubic-bezier(.2,.9,.25,1);max-height:86svh;overflow:auto}
.lens:not(.open){visibility:hidden;transition:transform .45s cubic-bezier(.2,.9,.25,1),visibility 0s .45s}
.lens.open{transform:translate(-50%,0)}
.lens .x{position:absolute;right:10px;top:10px;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--dim)}
.lens .x svg{width:18px;height:18px}
.pair{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center;margin:8px 0 14px}
.pair figure{margin:0;display:flex;flex-direction:column;gap:6px;min-width:0}
.pair img{width:100%;height:auto;border-radius:10px;border:1px solid var(--line);background:#fff;image-rendering:auto}
.pair figcaption{font:700 .7rem var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.pair .arrow{font-size:1.6rem;color:var(--muted)}
.big{display:flex;align-items:baseline;justify-content:center;gap:14px;font-variant-numeric:tabular-nums;font-weight:800;letter-spacing:-.04em;font-size:clamp(2.2rem,8vw,3.4rem);line-height:1}
.big .f{color:var(--fail)}.big .g{color:var(--pass)}.big i{font-style:normal;font-weight:400;color:var(--muted);font-size:.6em}
.ttl{text-align:center;color:var(--muted);margin:6px 0 16px}
.acts{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.acts button{min-height:48px;padding:0 20px;border-radius:99px;border:2px solid var(--line);font-weight:600;display:inline-flex;align-items:center;gap:8px}
.acts button[aria-expanded="true"]{border-color:var(--accent);color:var(--accent)}
.acts svg{width:18px;height:18px}
.panel{margin-top:14px;border-top:1px solid var(--line);padding-top:14px;font-size:.95rem}
.panel[hidden]{display:none}
.cmd{display:block;font-family:var(--mono);font-size:.8rem;background:var(--dim);border-radius:10px;padding:12px;overflow-x:auto;white-space:pre;tab-size:2}
.runs{display:flex;gap:8px;margin:10px 0;flex-wrap:wrap}
.run{font:700 .78rem var(--mono);padding:4px 10px;border-radius:99px;border:1.5px solid currentColor}
.run.f{color:var(--fail)}.run.p{color:var(--pass)}
.copy{margin-top:8px;min-height:44px;padding:0 16px;border-radius:99px;border:2px solid var(--line);font-weight:600}
.voices{display:flex;gap:6px;align-items:center;margin-bottom:8px;font-weight:700}
.voices i{width:16px;height:16px;border-radius:50%;background:var(--accent);display:inline-block}
.voices i.off{background:transparent;border:2px dashed var(--muted)}
blockquote{margin:0 0 8px;padding-left:12px;border-left:3px solid var(--accent);font-size:1.02rem;overflow-wrap:anywhere}
.src{font:.8rem var(--mono);color:var(--muted);overflow-wrap:anywhere}.src a{color:var(--accent)}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:39;opacity:0;pointer-events:none;transition:opacity .3s}
.scrim.open{opacity:1;pointer-events:auto}

/* Scene 3 — the wall */
.dark{background:var(--wall);color:var(--wall-ink)}
.tally{display:flex;align-items:baseline;gap:12px;font-variant-numeric:tabular-nums}
.tally b{font-size:clamp(3.4rem,10vw,7rem);font-weight:800;letter-spacing:-.05em;line-height:1;color:var(--glow)}
.tally span{font-size:clamp(1.4rem,3vw,2.2rem);color:var(--wall-muted);font-weight:600}
.wall{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(140px,26vw),1fr));gap:8px;width:100%;max-width:1100px}
.tile{aspect-ratio:16/10;border-radius:14px;background:var(--wall-dim);color:#8996a6;font-weight:700;font-size:clamp(.95rem,1.7vw,1.2rem);letter-spacing:-.01em;display:grid;place-items:center;padding:6px;transition:background .5s,color .5s,box-shadow .5s,transform .2s;min-height:48px}
.tile.lit{background:var(--glow);color:#04122e;box-shadow:0 0 34px -4px var(--glow)}
.tile:hover{transform:translateY(-2px)}
.tile[aria-pressed="true"]{outline:3px solid var(--wall-ink);outline-offset:2px}
.tilecard{width:100%;max-width:1100px;min-height:150px;border-radius:18px;background:var(--wall-dim);padding:20px clamp(16px,3vw,28px);display:flex;flex-direction:column;gap:12px;color:var(--wall-ink)}
.tilecard h3{margin:0;font-size:1.6rem;letter-spacing:-.03em}
.nums{display:flex;flex-wrap:wrap;gap:8px}
.nums span{font:700 1.15rem var(--mono);background:var(--glow);color:#04122e;border-radius:10px;padding:8px 12px}
.none{display:flex;align-items:center;gap:14px}
.none b{font-size:2.6rem;color:var(--wall-muted);font-weight:300}
.tilecard blockquote{border-color:var(--wall-muted);color:var(--wall-ink)}
.tilecard .src{color:var(--wall-muted)}.tilecard .src a{color:var(--glow)}
.tilecard .cmd{background:#0a0f15;color:var(--wall-ink)}
.tilecard .copy{border-color:#2d3846;color:var(--wall-ink)}
.taphint{color:var(--wall-muted);font-size:.95rem}

/* Scene 4 — echoes */
.big3{display:flex;align-items:baseline;gap:12px;font-variant-numeric:tabular-nums}
.big3 b{font-size:clamp(3.4rem,10vw,7rem);font-weight:800;letter-spacing:-.05em;line-height:1;color:var(--accent)}
.big3 span{font-size:clamp(1.2rem,2.6vw,1.9rem);color:var(--muted);font-weight:600}
.echo{width:100%;max-width:820px;aspect-ratio:820/460}
.echo svg{width:100%;height:100%;display:block}
.echo .n{cursor:pointer}.echo .n circle{transition:r .25s,opacity .4s}
.echo .n:focus-visible circle{stroke:var(--ink);stroke-width:3}
.echoinfo{min-height:2.6rem;text-align:center;color:var(--muted);font-size:1.05rem}
.echoinfo b{color:var(--ink)}

/* Scene 5 — yours */
.mine h2{font-size:clamp(2rem,6vw,4rem);font-weight:800;letter-spacing:-.04em;margin:0;text-align:center}
.term{width:100%;max-width:820px;background:#0d1117;color:#eef1f5;border-radius:16px;padding:18px 20px;font:1rem/1.6 var(--mono);overflow-x:auto;display:flex;flex-direction:column;gap:6px}
.term div{white-space:nowrap}.term .p{color:#6ea0ff}.term .c{color:#8b98a8}
.foot{color:var(--muted);font:.85rem var(--mono);text-align:center;max-width:820px}
@media (max-width:640px){.pair{grid-template-columns:1fr}.pair .arrow{transform:rotate(90deg);text-align:center}.dots{display:none}.mark{top:12px}.lbl{font-size:.62rem}.pin{width:34px;height:34px;margin:-17px 0 0 -17px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<a class="mark" href="#s1" aria-label="AXL"><i></i>AXL</a>
<nav class="dots" aria-label="Scenes"><a href="#s1" aria-label="The word"><i></i></a><a href="#s2" aria-label="Measured"><i></i></a><a href="#s3" aria-label="The wall of words"><i></i></a><a href="#s4" aria-label="Who says so"><i></i></a><a href="#s5" aria-label="Try it"><i></i></a></nav>

<main>
<section class="scene hero" id="s1" aria-label="The word">
  <h1 class="word" id="word">polish</h1>
  <div class="means" id="means" role="group" aria-label="Three things this word means"></div>
  <div class="said" id="said" aria-live="polite"></div>
  <a class="cta" href="#s2" id="cta">Measure it <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v16m0 0l-6-6m6 6l6-6"/></svg></a>
</section>

<section class="scene" id="s2" aria-label="The same page, before and after">
  <div class="stagewrap">
    <div class="counter" id="counter"><b id="cnt">61</b><span>problems found</span></div>
    <div class="stage" id="stage">
      <div class="layer before"><iframe id="fBefore" title="The page before" tabindex="-1"></iframe></div>
      <div class="layer after" id="afterLayer"><iframe id="fAfter" title="The page after" tabindex="-1"></iframe></div>
      <span class="lbl a">After</span><span class="lbl b">Before</span>
      <div id="pins"></div>
      <div class="handle" id="handle" role="slider" tabindex="0" aria-label="Before and after" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 7l-5 5 5 5M16 7l5 5-5 5"/></svg></span></div>
    </div>
  </div>
  <p class="hint2" id="hint2"></p>
</section>

<section class="scene dark" id="s3" aria-label="All the design words">
  <div class="tally"><b id="lit">0</b><span>of <span id="total">34</span> design words we checked have a number</span></div>
  <div class="wall" id="wall"></div>
  <div class="tilecard" id="tilecard" aria-live="polite"><p class="taphint">Touch a word.</p></div>
</section>

<section class="scene" id="s4" aria-label="Who says so">
  <div class="big3"><b id="two">3</b><span>of <span id="nclaims">377</span> claims have two independent sources</span></div>
  <div class="echo" id="echo"></div>
  <div class="echoinfo" id="echoinfo" aria-live="polite">The blue dots are sources that trace back to one origin. Touch one.</div>
</section>

<section class="scene mine" id="s5" aria-label="Try it">
  <h2>Your page next.</h2>
  <div class="term" id="term" tabindex="0" role="region" aria-label="Commands"></div>
  <button class="copy" id="copyMain" type="button">Copy the command</button>
  <p class="foot" id="foot"></p>
</section>
</main>

<div class="scrim" id="scrim"></div>
<aside class="lens" id="lens" role="dialog" aria-modal="true" aria-labelledby="lensTitle" inert>
  <button class="x" id="lensX" type="button" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M5 5l14 14M19 5L5 19"/></svg></button>
  <div class="pair"><figure><img id="imgB" alt="" width="10" height="10"><figcaption>Before</figcaption></figure><span class="arrow" aria-hidden="true">→</span><figure><img id="imgA" alt="" width="10" height="10"><figcaption>After</figcaption></figure></div>
  <div class="big" id="big"></div>
  <p class="ttl" id="lensTitle"></p>
  <div class="acts">
    <button type="button" id="bHow" aria-expanded="false" aria-controls="pHow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 17l6-6-6-6M12 19h8"/></svg>How it's checked</button>
    <button type="button" id="bWho" aria-expanded="false" aria-controls="pWho"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>Who says so</button>
  </div>
  <div class="panel" id="pHow" hidden></div>
  <div class="panel" id="pWho" hidden></div>
