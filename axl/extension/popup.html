<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>AXL Capture</title><link rel="stylesheet" href="ui.css">
<style>
body{width:360px;padding:16px}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.site{padding:12px 14px;border-radius:14px;background:var(--panel);box-shadow:0 0 0 1px var(--line);margin-bottom:12px}
.site b{display:block;font-size:1.05rem;word-break:break-all}
.how{margin:10px 2px 12px;min-height:3.9em}
.go{display:flex;gap:8px}.go .btn{flex:1}
.status{display:flex;align-items:center;gap:8px;margin:12px 2px 6px;font-weight:600}
ol{list-style:none;margin:0;padding:0;max-height:180px;overflow:auto;border-radius:12px;background:var(--panel);box-shadow:0 0 0 1px var(--line)}
li{display:flex;align-items:center;gap:8px;padding:8px 6px 8px 12px;border-top:1px solid var(--line)}li:first-child{border-top:0}
li span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}li small{display:block;color:var(--muted);font:.72rem var(--mono);overflow:hidden;text-overflow:ellipsis}
li button{width:28px;height:28px;border-radius:50%;color:var(--muted);font-size:1.1rem}li button:hover{background:var(--soft);color:var(--ink)}
.empty{padding:14px;color:var(--muted);font-size:.86rem}
footer{display:flex;gap:8px;margin-top:12px}footer .btn{flex:1}
.err{margin-top:10px;color:var(--rec);font-size:.86rem}
</style></head>
<body>
<header><span class="mark"><i></i>AXL Capture</span><span class="k" id="count"></span></header>
<div class="site"><span class="k">Site</span><b id="origin">…</b><span class="note" id="perm"></span></div>
<div class="seg" role="group" aria-label="How to capture"><button type="button" data-mode="record" aria-pressed="true">Record as I browse</button><button type="button" data-mode="page" aria-pressed="false">One page at a time</button></div>
<p class="how note" id="how"></p>
<div class="go"><button class="btn primary" id="go" type="button"></button></div>
<div class="status" id="status" hidden></div>
<ol id="pages"></ol>
<footer><button class="btn" id="review" type="button">Review &amp; export</button><button class="btn" id="clear" type="button">Clear</button></footer>
<p class="err" id="err" hidden></p>
<p class="note" style="margin:12px 2px 0">Only capture sites you have permission to work on. Pages stay on this computer until you export them.</p>
<script src="popup.js" type="module"></script>
</body></html>
