<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AXL Verb Studio</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect x=%278%27 y=%278%27 width=%2716%27 height=%2716%27 rx=%274%27 fill=%27%23d1175e%27/%3E%3C/svg%3E">
<meta name="description" content="Design words have no shared meaning. See each source's version as a subway line, and build your own version a tool can check.">
<style>
/* Concept: a transit map for one word. Each source is a line leaving the same station ("polish"); tweaks are stops; where lines share a stop, that is agreement.
   Left: the page under the knife. Hold Shift to flash the original. Bottom: your line, being built. */
:root{
  --bg:#f7f7f5;--panel:#ffffff;--ink:#131316;--muted:#5b5d66;--line:#dfe0e4;--soft:#eeeff1;
  --mine:#d1175e;--on-mine:#ffffff;--ok:#0b7a4b;
  --s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--s5:#008300;--s6:#4a3aa7;--s7:#e34948;--sx:#9a9ca5;
  --sans:"Inter Tight","Helvetica Neue",Arial,system-ui,sans-serif;--mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101114;--panel:#17181c;--ink:#f1f1f3;--muted:#a3a6b0;--line:#2b2d34;--soft:#202228;--mine:#ff4f8f;--on-mine:#1a0610;--ok:#4cd694;--s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#008300;--s6:#9085e9;--s7:#e66767;--sx:#6b6e78;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#101114;--panel:#17181c;--ink:#f1f1f3;--muted:#a3a6b0;--line:#2b2d34;--soft:#202228;--mine:#ff4f8f;--on-mine:#1a0610;--ok:#4cd694;--s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#008300;--s6:#9085e9;--s7:#e66767;--sx:#6b6e78;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 var(--sans);-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:3px solid var(--mine);outline-offset:2px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
kbd{font:600 .75rem var(--mono);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:1px 5px;background:var(--panel)}
.app{min-height:100svh;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto 1fr auto;padding-inline:clamp(12px,2vw,24px)}

/* top */
.top{display:flex;align-items:center;gap:clamp(12px,2vw,28px);padding-block:14px 10px;flex-wrap:wrap;position:relative}
.wordbtn{display:inline-flex;align-items:baseline;gap:10px;font-weight:800;letter-spacing:-.04em;font-size:clamp(2.2rem,4.6vw,3.6rem);line-height:1;border-radius:10px;padding:2px 6px 4px 2px}
.wordbtn:hover{background:var(--soft)}
.wordbtn svg{width:22px;height:22px;color:var(--muted);align-self:center}
.claim{font-size:clamp(1.05rem,1.9vw,1.45rem);font-weight:700;letter-spacing:-.02em;color:var(--muted)}
.claim b{color:var(--ink)}
.wpop{position:absolute;left:0;top:calc(100% - 2px);z-index:30;width:min(640px,calc(100vw - 24px));background:var(--panel);border-radius:14px;box-shadow:0 0 0 1px var(--line),0 24px 60px -20px rgba(0,0,0,.4);padding:12px;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.wpop[hidden]{display:none}
.wpop p{grid-column:1/-1;margin:0 0 4px;font-size:.8rem;color:var(--muted)}
.wp{min-height:44px;text-align:left;padding:6px 10px;border-radius:9px;display:flex;flex-direction:column;justify-content:center;background:var(--soft)}
.wp b{font-size:.98rem;letter-spacing:-.01em}.wp span{font:.72rem var(--mono);color:var(--muted)}
.wp.multi{background:var(--ink);color:var(--bg)}.wp.multi span{color:inherit;opacity:.75}
.wp[aria-current="true"]{box-shadow:0 0 0 2px var(--mine)}

/* bench */
.bench{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(340px,1fr);gap:clamp(12px,1.8vw,24px);min-height:0;align-items:start}
.left{display:flex;flex-direction:column;gap:8px;min-width:0;position:sticky;top:8px}
.versions{display:flex;gap:6px;align-items:center;overflow-x:auto;scrollbar-width:thin;padding-bottom:3px}.ver{flex:none}
.ver{min-height:36px;padding:0 12px 0 8px;border-radius:99px;border:1.5px solid var(--line);font-weight:600;font-size:.88rem;display:inline-flex;align-items:center;gap:7px;position:relative;overflow:hidden;background:var(--panel)}
.ver i{width:14px;height:6px;border-radius:3px;background:var(--c,var(--ink))}
.ver kbd{border:0;background:transparent;padding:0;color:var(--muted);font-size:.7rem}
.ver[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}.ver[aria-pressed="true"] kbd{color:inherit}
.ver.mine{--c:var(--mine)}.ver.mine[aria-pressed="true"]{background:var(--mine);border-color:var(--mine);color:var(--on-mine)}
.ver .bar{position:absolute;left:0;bottom:0;height:3px;background:var(--mine);width:0}
.ver[aria-pressed="true"] .bar{animation:fill 1.8s linear forwards}
.stopped .ver .bar{display:none}
@keyframes fill{to{width:100%}}
.frame{position:relative;border-radius:12px;overflow:hidden;background:#fff;box-shadow:0 0 0 1px var(--line),0 24px 60px -36px rgba(0,0,0,.45);aspect-ratio:980/760;width:100%;max-height:calc(100svh - 190px);user-select:none}
.frame iframe{position:absolute;left:0;top:0;width:980px;height:760px;border:0;transform-origin:0 0;pointer-events:none}
.frame{outline:3px solid var(--fc,transparent);outline-offset:-3px}
#pv{transition:opacity .16s ease}
.frame.peeking #pv{opacity:0}
.frame.peeking{--fc:var(--ink)}
.state{position:absolute;left:12px;bottom:14px;z-index:3;display:inline-flex;align-items:center;gap:8px;font:700 .85rem var(--sans);padding:7px 12px;border-radius:99px;background:var(--fc,var(--ink));color:#fff;box-shadow:0 6px 18px rgba(0,0,0,.25);pointer-events:none}
.frame.peeking .state{background:#fff;color:#131316;box-shadow:0 0 0 2px #131316}
.hold{position:absolute;right:12px;bottom:14px;z-index:3;min-height:44px;padding:0 16px;border-radius:99px;background:rgba(19,19,22,.86);color:#fff;font-weight:700;font-size:.88rem;display:inline-flex;align-items:center;gap:8px;box-shadow:0 8px 24px rgba(0,0,0,.3);user-select:none;touch-action:none}
.hold kbd{background:transparent;color:#fff;border-color:rgba(255,255,255,.5)}
.frame.peeking .hold{background:#fff;color:#131316}.frame.peeking .hold kbd{color:#131316;border-color:#131316}
@media (hover:none){.hold kbd{display:none}}
.hint{display:flex;gap:14px;flex-wrap:wrap;font-size:.8rem;color:var(--muted)}
.says{min-height:2.6em;font-size:.95rem;color:var(--muted);margin:0}
.says q{color:var(--ink);font-weight:600}.says a{color:inherit;font:.78rem var(--mono)}

/* the map */
.map{background:var(--panel);border-radius:14px;box-shadow:0 0 0 1px var(--line);padding:14px 16px 10px;min-width:0}
.maph{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.maph h2{margin:0;font-size:1.15rem;letter-spacing:-.02em}
.nums{display:flex;gap:14px;margin:8px 0 10px;flex-wrap:wrap}
.nums div{display:flex;flex-direction:column}
.nums b{font-size:1.6rem;font-weight:800;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.nums span{font-size:.75rem;color:var(--muted)}
.nums .zero b{color:var(--mine)}
.metro{overflow-y:auto;max-height:calc(100svh - 300px);margin-inline:-6px}
.metro svg{display:block;width:100%;height:auto}
.metro text{font-family:var(--sans);fill:var(--ink)}
.metro .cat{font:700 10px var(--mono);letter-spacing:.1em;fill:var(--muted);text-transform:uppercase}
.metro .row{cursor:pointer}
.metro .row .hit{fill:transparent}
.metro .row:hover .hit,.metro .row:focus-visible .hit{fill:var(--soft)}
.metro .row:focus-visible{outline:none}
.metro .row.mine .lbl{fill:var(--mine);font-weight:700}
.metro .ck{fill:var(--ok);font-size:11px}
.metro .ln{transition:opacity .25s}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:.75rem;color:var(--muted);margin-top:8px}
.legend svg{vertical-align:-3px}
details.all{margin-top:10px;border-top:1px solid var(--line);padding-top:8px}
details.all summary{cursor:pointer;font-weight:600;min-height:40px;display:flex;align-items:center}
.allcats{display:grid;gap:8px;margin-top:6px}
.allcats h3{margin:0;font:700 .68rem var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.allcats div{display:flex;flex-wrap:wrap;gap:4px}
.tw{min-height:32px;padding:0 9px;border-radius:8px;font-size:.82rem;background:var(--soft);border:1.5px solid transparent}
.tw[aria-pressed="true"]{background:var(--mine);color:var(--on-mine)}

/* tray */
.tray{position:sticky;bottom:0;z-index:5;margin-top:12px;background:var(--panel);border-radius:14px 14px 0 0;box-shadow:0 -1px 0 var(--line),0 -16px 40px -30px rgba(0,0,0,.4);padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.tray .name{display:flex;align-items:center;gap:6px;font-weight:800;font-size:1.25rem;letter-spacing:-.02em}
.tray input{width:9.5em;border:0;border-bottom:2px solid var(--mine);background:transparent;font-weight:800;letter-spacing:-.02em;padding:2px 0}
.tray .facts{font-size:.9rem;color:var(--muted);flex:1;min-width:220px}
.tray .facts b{color:var(--ink)}.tray .facts .m{color:var(--mine);font-weight:700}
.btn{min-height:44px;padding:0 18px;border-radius:99px;font-weight:700;border:1.5px solid var(--line)}
.btn.small{min-height:34px;padding:0 12px}
.btn.primary{background:var(--mine);color:var(--on-mine);border-color:var(--mine)}
.btn:disabled{opacity:.4;cursor:default}

/* sheet */
.sheet{position:fixed;inset:auto 0 0 0;margin:auto;z-index:40;width:min(680px,100%);background:var(--panel);border-radius:18px 18px 0 0;box-shadow:0 -20px 60px rgba(0,0,0,.35);padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));transform:translateY(105%);transition:transform .35s cubic-bezier(.2,.9,.25,1);max-height:88svh;overflow:auto}
.sheet.open{transform:none}.sheet:not(.open){visibility:hidden;transition:transform .35s,visibility 0s .35s}
.sheet h2{margin:0 0 4px;font-size:1.4rem;letter-spacing:-.02em}
.sheet p{margin:0 0 10px;color:var(--muted)}
pre{margin:0 0 10px;background:var(--soft);border-radius:10px;padding:12px;overflow:auto;font:.8rem/1.45 var(--mono);max-height:260px}
.row2{display:flex;gap:8px;flex-wrap:wrap}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:39;opacity:0;pointer-events:none;transition:opacity .3s}.scrim.open{opacity:1;pointer-events:auto}

/* below */
.below{max-width:1100px;margin:0 auto;padding:64px clamp(12px,2vw,24px) 80px;display:grid;grid-template-columns:minmax(0,1fr);gap:18px}
.below h2{font-size:clamp(1.5rem,3vw,2.2rem);letter-spacing:-.03em;margin:0}
.below .sub{color:var(--muted);margin:0}
.vague{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.vague blockquote{margin:0;background:var(--panel);border-radius:12px;box-shadow:0 0 0 1px var(--line);padding:12px 14px;font-size:.92rem}
.vague cite{display:block;margin-top:6px;font:.72rem var(--mono);color:var(--muted);font-style:normal}
.foot{color:var(--muted);font:.8rem var(--mono);text-align:center;padding-bottom:40px}
@media (max-width:900px){
  .bench{grid-template-columns:minmax(0,1fr)}.left{position:static}.frame{max-height:none}.metro{max-height:none}
  .tray{gap:8px;padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px))}.tray .name{font-size:1.05rem}.tray .facts{min-width:0;flex-basis:100%;order:3;font-size:.82rem}.tray .btn{min-height:40px;padding:0 14px}.tray input{width:6.5em}.tray .facts .btn{min-height:32px}
  .versions{flex-wrap:nowrap;overflow-x:auto;padding-bottom:2px}.ver{flex:none}.hint .keys{display:none}
}
@media (hover:none){.hint .keys{display:none}}
@media (hover:hover){.hint .touch{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <button class="wordbtn" id="wordBtn" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="wordPop"><span id="wordTxt">polish</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg><span class="sr">choose another word</span></button>
    <div class="claim" id="claim"></div>
    <div class="wpop" id="wordPop" hidden></div>
  </header>

  <div class="bench">
    <section class="left" aria-label="The page">
      <div class="versions" id="versions" role="group" aria-label="Whose version is shown"></div>
      <div class="frame" id="frame"><iframe id="pv0" title="Demo page, original" tabindex="-1" aria-hidden="true"></iframe><iframe id="pv" title="Demo page with the selected version applied" tabindex="-1"></iframe><span class="state" id="state"></span><button class="hold" id="hold" type="button" aria-label="Hold to see the original"><kbd>Shift</kbd> hold to see the original</button></div>
      <div class="hint"><span class="keys"><kbd>1</kbd>–<kbd>9</kbd> switch source · <kbd>Y</kbd> yours · changed parts flash when you switch</span></div>
      <p class="says" id="says" aria-live="polite"></p>
    </section>

    <section class="map" aria-labelledby="mapTitle">
      <div class="maph"><h2 id="mapTitle"></h2><span style="font-size:.8rem;color:var(--muted)">tap a stop to add it to yours</span></div>
      <div class="nums" id="nums"></div>
      <div class="metro" id="metro"></div>
      <div class="legend"><span><svg width="34" height="14" aria-hidden="true"><line x1="7" y1="7" x2="27" y2="7" stroke="var(--ink)" stroke-width="2"/><circle cx="7" cy="7" r="5" fill="var(--panel)" stroke="var(--ink)" stroke-width="2"/><circle cx="27" cy="7" r="5" fill="var(--panel)" stroke="var(--ink)" stroke-width="2"/></svg> shared stop: those sources agree</span><span><svg width="12" height="12" aria-hidden="true"><circle cx="6" cy="6" r="4" fill="var(--panel)" stroke="var(--muted)" stroke-width="2.5"/></svg> one source only</span><span><svg width="30" height="10" aria-hidden="true"><line x1="2" y1="5" x2="28" y2="5" stroke="var(--muted)" stroke-width="4" stroke-dasharray="2 6" stroke-linecap="round"/></svg> copies another source</span><span style="color:var(--ok)">✓ a tool checks it</span></div>
      <details class="all"><summary id="allSum"></summary><div class="allcats" id="allcats"></div></details>
    </section>
  </div>

  <footer class="tray" aria-label="Your word">
    <div class="name">my <input id="myName" aria-label="Name of your version" value="polish" maxlength="24"></div>
    <div class="facts" id="facts" aria-live="polite"></div>
    <button class="btn" id="clear" type="button">Clear</button>
    <button class="btn primary" id="save" type="button">Save my word</button>
  </footer>
</div>

<main class="below">
  <h2 id="bigNo"></h2>
  <p class="sub" id="vagueSub"></p>
  <div class="vague" id="vague"></div>
  <p class="foot" id="foot"></p>
</main>

<div class="scrim" id="scrim"></div>
<aside class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" inert>
  <h2 id="sheetTitle"></h2>
  <p>This file is the whole definition. A command runs the checks; no agent has to guess what the word means.</p>
  <pre id="json" tabindex="0"></pre>
  <pre id="cmd" tabindex="0"></pre>
  <div class="row2"><button class="btn primary" id="dl" type="button">Download</button><button class="btn" id="cp" type="button">Copy file</button><button class="btn" id="cpc" type="button">Copy command</button><button class="btn" id="close" type="button">Close</button></div>
</aside>

<script>
const D = /*DATA*/null;
(function () {
  'use strict';
  const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
  const esc = t => String(t == null ? '' : t).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const T = Object.fromEntries(D.tweaks.map(t => [t.id, t])), CAT = D.categories;
  const LC = ['var(--s1)', 'var(--s2)', 'var(--s3)', 'var(--s4)', 'var(--s5)', 'var(--s6)', 'var(--s7)']; const lc = i => LC[i] || 'var(--sx)';
  const st = { word: 'polish', v: 0, mine: new Set(), mode: 'theirs', auto: true, peek: false };
  let timer = null;
  const W = () => D.words.find(w => w.word === st.word), VS = () => W().versions, cur = () => VS()[Math.min(st.v, VS().length - 1)];

  /* ---- word picker (custom, never a native select) ---- */
  const pop = $('#wordPop'), wbtn = $('#wordBtn');
  const words = D.words.slice().sort((a, b) => b.versions.length - a.versions.length || a.word.localeCompare(b.word));
  function renderPop() { pop.innerHTML = `<p>${D.words.length} words from ${D.stats.sources} sources. Dark ones are defined by more than one source.</p>` + words.map(w => `<button class="wp${w.versions.length > 1 ? ' multi' : ''}" type="button" data-w="${esc(w.word)}" aria-current="${w.word === st.word}"><b>${esc(w.word)}</b><span>${w.versions.length} source${w.versions.length > 1 ? 's' : ''} · ${new Set(w.versions.flatMap(v => v.tweaks)).size} tweaks</span></button>`).join(''); }
  const openPop = on => { pop.hidden = !on; wbtn.setAttribute('aria-expanded', on); if (on) { renderPop(); (pop.querySelector('[aria-current="true"]') || pop.querySelector('.wp')).focus(); } };
  wbtn.addEventListener('click', () => openPop(pop.hidden));
  pop.addEventListener('click', e => { const b = e.target.closest('.wp'); if (!b) return; setWord(b.dataset.w); openPop(false); wbtn.focus(); });
  document.addEventListener('click', e => { if (!pop.hidden && !e.target.closest('#wordPop,#wordBtn')) openPop(false); });
  function setWord(w) { stopAuto(); st.word = w; st.v = 0; st.mode = 'theirs'; if (!st.mine.size) $('#myName').value = w; $('#wordTxt').textContent = w; render(); }

  /* ---- the page: original underneath, the chosen version on top ---- */
  const pv = $('#pv'), pv0 = $('#pv0'), frame = $('#frame');
  pv.srcdoc = D.before; pv0.srcdoc = D.before;
  const fit = () => { const s = `scale(${frame.clientWidth / D.frame.width})`; pv.style.transform = s; pv0.style.transform = s; };
  new ResizeObserver(fit).observe(frame);
  const cssOf = ids => [...ids].map(i => T[i] && T[i].css).filter(Boolean).join('\n');
  const selsOf = css => [...new Set([...css.replace(/@media[^{]*\{/g, '').matchAll(/([^{}]+)\{[^{}]*\}/g)].flatMap(m => m[1].split(',')).map(s => s.replace(/::?[a-z-]+(\([^)]*\))?/g, '').trim()).filter(s => s && s !== '*' && !/^(html|body)$/.test(s)))];
  const shownSet = () => st.mode === 'orig' ? new Set() : st.mode === 'mine' ? st.mine : new Set(cur().tweaks);
  let flashT = null, lastCss = null;
  const post = (f, css, hl) => { try { f.contentWindow.postMessage({ type: 'lab-recipe', css, highlight: hl }, '*'); } catch (e) {} };
  function paint(flash) {
    const css = cssOf(shownSet());
    const hl = flash && !reduced && css ? selsOf(css).map(s => `${s}`).join(',') + '{outline:2px dashed rgba(209,23,94,.6)!important;outline-offset:1px}' : '';
    post(pv, css, hl); lastCss = css;
    clearTimeout(flashT); if (hl) flashT = setTimeout(() => post(pv, css, ''), 1100);
    const v = cur(), mine = st.mode === 'mine', idx = VS().indexOf(v);
    frame.style.setProperty('--fc', mine ? 'var(--mine)' : lc(idx));
    $('#state').textContent = st.peek ? 'Original' : mine ? `Your ${$('#myName').value || 'word'}` : `${v.src}'s ${st.word}`;
  }
  pv.addEventListener('load', () => { fit(); paint(false); }); pv0.addEventListener('load', fit);

  /* ---- compare: hold Shift or the button; the version fades away to the original underneath ---- */
  const peek = on => { if (st.peek === on) return; st.peek = on; frame.classList.toggle('peeking', on); $('#state').textContent = on ? 'Original' : ''; paint(!on); };
  addEventListener('keydown', e => {
    if (e.target.closest && e.target.closest('input')) return;
    if (e.key === 'Shift') { stopAuto(); peek(true); return; }
    if (e.key === 'Escape') { if (!pop.hidden) { openPop(false); wbtn.focus(); } return; }
    const n = +e.key; if (n >= 1 && n <= Math.min(9, VS().length) && !e.metaKey && !e.ctrlKey) { stopAuto(); st.mode = 'theirs'; st.v = n - 1; render(true); }
    if (e.key === 'y' || e.key === 'Y') { stopAuto(); st.mode = 'mine'; render(true); }
  });
  addEventListener('keyup', e => { if (e.key === 'Shift') peek(false); });
  addEventListener('blur', () => peek(false));
  const hold = $('#hold');
  hold.addEventListener('pointerdown', e => { e.preventDefault(); stopAuto(); peek(true); hold.setPointerCapture(e.pointerId); });
  ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(ev => hold.addEventListener(ev, () => peek(false)));
  hold.addEventListener('keydown', e => { if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); stopAuto(); peek(true); } });
  hold.addEventListener('keyup', e => { if (e.key === ' ' || e.key === 'Enter') peek(false); });

  /* ---- versions row ---- */
  function renderVersions() {
    $('#versions').innerHTML = VS().map((v, i) => `<button class="ver" type="button" data-i="${i}" style="--c:${lc(i)}" aria-pressed="${st.mode === 'theirs' && st.v === i}"><i></i>${esc(v.src)}${i < 9 ? `<kbd>${i + 1}</kbd>` : ''}<span class="bar"></span></button>`).join('')
      + `<button class="ver mine" type="button" data-i="mine" aria-pressed="${st.mode === 'mine'}"><i></i>yours<kbd>Y</kbd></button>`;
  }
  $('#versions').addEventListener('click', e => { const b = e.target.closest('.ver'); if (!b) return; stopAuto(); if (b.dataset.i === 'mine') st.mode = 'mine'; else { st.mode = 'theirs'; st.v = +b.dataset.i; } render(true); });

  /* ---- the subway map ---- */
  function renderMap() {
    const vs = VS(), lines = vs.map((v, i) => ({ name: v.src, color: lc(i), dash: v.kind === 'derivative', set: new Set(v.tweaks), active: st.mode === 'theirs' && st.v === i }));
    if (st.mine.size) lines.push({ name: 'yours', color: 'var(--mine)', set: st.mine, active: st.mode === 'mine', mine: true });
    const ids = [...new Set(lines.flatMap(l => [...l.set]))].filter(i => T[i]);
    const byCat = CAT.map(c => ({ c, s: ids.filter(i => T[i].category === c).sort((a, b) => lines.filter(l => l.set.has(b)).length - lines.filter(l => l.set.has(a)).length || T[a].name.localeCompare(T[b].name)) })).filter(x => x.s.length);
    const LANE = lines.length <= 6 ? 22 : Math.max(10, Math.floor(150 / lines.length)), X0 = 20, nL = lines.length, LX = X0 + (nL - 1) * LANE + 26, ROW = 28, CATH = 24, W = 460;
    const x = i => X0 + i * LANE; let y = 58; const rows = [];
    byCat.forEach(g => { rows.push({ cat: g.c, y: y + 16 }); y += CATH; g.s.forEach(id => { rows.push({ id, y: y + ROW / 2 }); y += ROW; }); });
    const H = y + 16, anyActive = lines.some(l => l.active);
    const last = lines.map(l => { let m = 58; rows.forEach(r => { if (r.id && l.set.has(r.id)) m = r.y; }); return m; });
    let s = '';
    // origin station: the word, all lines leave from here
    s += `<rect x="${x(0) - 11}" y="12" width="${(nL - 1) * LANE + 22}" height="22" rx="11" fill="var(--ink)"/><text x="${LX}" y="28" style="font-weight:800;font-size:17px;letter-spacing:-.02em">${esc(st.word)}</text>`;
    lines.forEach((l, i) => { const op = anyActive && !l.active ? .22 : 1;
      s += `<g class="ln" opacity="${op}"><line x1="${x(i)}" y1="23" x2="${x(i)}" y2="${last[i]}" stroke="${l.color}" stroke-width="${LANE < 16 ? 4 : 6}" stroke-linecap="round"${l.dash ? ' stroke-dasharray="2 6"' : ''}/><circle cx="${x(i)}" cy="${last[i]}" r="7" fill="${l.color}"/></g>`; });
    rows.forEach(r => {
      if (r.cat) { s += `<text class="cat" x="${LX}" y="${r.y}">${esc(r.cat)}</text>`; return; }
      const t = T[r.id], on = lines.map((l, i) => l.set.has(r.id) ? i : -1).filter(i => i >= 0), mine = st.mine.has(r.id), theirs = on.filter(i => !lines[i].mine);
      let mark;
      if (on.length > 1) mark = `<line x1="${x(on[0])}" y1="${r.y}" x2="${x(on[on.length - 1])}" y2="${r.y}" stroke="var(--ink)" stroke-width="2.5"/>` + on.map(i => `<circle cx="${x(i)}" cy="${r.y}" r="6.5" fill="var(--panel)" stroke="var(--ink)" stroke-width="2.5"/>`).join('');
      else mark = `<circle cx="${x(on[0])}" cy="${r.y}" r="5.5" fill="var(--panel)" stroke="${lines[on[0]].color}" stroke-width="3"/>`;
      const agree = theirs.length > 1 ? ` <tspan style="font:700 10px var(--mono)" fill="var(--muted)">${theirs.length}/${vs.length}</tspan>` : '';
      s += `<g class="row${mine ? ' mine' : ''}" role="button" tabindex="0" aria-pressed="${mine}" data-id="${esc(r.id)}" aria-label="${esc(t.name)}, asked by ${theirs.length} of ${vs.length} sources${t.check ? ', a tool checks it' : ''}"><rect class="hit" x="0" y="${r.y - ROW / 2 + 1}" width="${W}" height="${ROW - 2}" rx="6"/>${mark}<text class="lbl" x="${LX}" y="${r.y + 4.5}" font-size="13.5">${esc(t.name)}${t.check ? ' <tspan class="ck">✓</tspan>' : ''}${agree}</text></g>`;
    });
    $('#metro').innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="group" aria-label="Subway map: each source's line through the tweaks it asks for">${s}</svg>`;
    // headline numbers: the lack of a standard, counted
    const union = new Set(vs.flatMap(v => v.tweaks)), shared = [...union].filter(i => vs.filter(v => v.tweaks.includes(i)).length > 1).length, all = [...union].filter(i => vs.every(v => v.tweaks.includes(i))).length;
    $('#mapTitle').textContent = vs.length > 1 ? `How ${vs.length} sources define “${st.word}”` : `How ${vs[0].src} defines “${st.word}”`;
    $('#nums').innerHTML = `<div><b>${vs.length}</b><span>source${vs.length > 1 ? 's' : ''}</span></div><div><b>${union.size}</b><span>different tweaks</span></div>` + (vs.length > 1 ? `<div><b>${shared}</b><span>shared by 2+</span></div><div class="${all ? '' : 'zero'}"><b>${all}</b><span>shared by all</span></div>` : '');
  }
  const toggle = id => { stopAuto(); st.mine.has(id) ? st.mine.delete(id) : st.mine.add(id); st.mode = 'mine'; render(true); };
  $('#metro').addEventListener('click', e => { const r = e.target.closest('.row'); if (r) toggle(r.dataset.id); });
  $('#metro').addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { const r = e.target.closest('.row'); if (r) { e.preventDefault(); toggle(r.dataset.id); requestAnimationFrame(() => { const n = $(`#metro .row[data-id="${r.dataset.id}"]`); if (n) n.focus(); }); } } });

  /* every other tweak, one tap away but out of the way */
  $('#allcats').innerHTML = CAT.map(c => { const ts = D.tweaks.filter(t => t.category === c); return ts.length ? `<h3>${esc(c)}</h3><div>${ts.map(t => `<button class="tw" type="button" data-id="${esc(t.id)}" aria-pressed="false">${esc(t.name)}</button>`).join('')}</div>` : ''; }).join('');
  $('#allcats').addEventListener('click', e => { const b = e.target.closest('.tw'); if (b) toggle(b.dataset.id); });

  /* ---- your word ---- */
  const allVersions = D.words.flatMap(w => w.versions.map(v => ({ ...v, word: w.word }))).filter(v => v.tweaks.length);
  const jac = (a, b) => { const B = new Set(b); let i = 0; a.forEach(x => { if (B.has(x)) i++; }); const u = new Set([...a, ...b]).size; return u ? i / u : 0; };
  function facts() {
    const n = st.mine.size, ck = [...st.mine].filter(i => T[i].check).length, name = $('#myName').value.trim() || 'word';
    if (!n) { $('#facts').innerHTML = `Tap stops on the map to build <b>your</b> ${esc(name)}, or <button class="btn small" id="startFrom" type="button">start from ${esc(cur().src)}'s</button>`; return; }
    const near = allVersions.map(v => ({ v, s: jac([...st.mine], v.tweaks) })).sort((a, b) => b.s - a.s).slice(0, 2).filter(x => x.s > 0);
    $('#facts').innerHTML = `<b>${n}</b> tweak${n > 1 ? 's' : ''} · <b>${ck}</b> a tool can check · nearest named words: ${near.length ? near.map(x => `<span class="m">${esc(x.v.word)}</span> (${esc(x.v.src)}) ${Math.round(x.s * 100)}%`).join(', ') : 'none'}`;
  }
  $('#facts').addEventListener('click', e => { if (e.target.id === 'startFrom') { stopAuto(); cur().tweaks.forEach(i => st.mine.add(i)); st.mode = 'mine'; render(); } });
  $('#myName').addEventListener('input', facts);
  $('#clear').addEventListener('click', () => { st.mine.clear(); st.mode = 'theirs'; render(); });

  function render(flash) {
    const v = cur(), nv = VS().length;
    paint(!!flash); renderVersions(); renderMap();
    $('#claim').innerHTML = nv > 1 ? `<b>Same word.</b> ${nv} sources, ${nv} different pages.` : `Only <b>${esc(v.src)}</b> uses this word.`;
    $('#says').innerHTML = st.mode === 'mine' ? `Your ${esc($('#myName').value || 'word')}: ${st.mine.size} tweak${st.mine.size === 1 ? '' : 's'}.`
      : `${esc(v.src)}: ${v.quote ? `<q>${esc(v.quote)}</q>` : `${v.tweaks.length} tweaks from ${v.n || 0} statements`} <a href="${esc(v.url)}" target="_blank" rel="noopener noreferrer">source</a>`;
    $$('#allcats .tw').forEach(b => b.setAttribute('aria-pressed', st.mine.has(b.dataset.id)));
    $('#allSum').textContent = `All ${D.tweaks.length} tweaks from every word (${st.mine.size} in yours)`;
    $('#save').disabled = !st.mine.size;
    facts();
  }

  /* ---- the hook: cycle through everyone's version until the visitor touches anything ---- */
  function tick() { if (!st.auto) return; st.v = (st.v + 1) % VS().length; st.mode = 'theirs'; render(false); timer = setTimeout(tick, 1800); }
  function stopAuto() { if (!st.auto) return; st.auto = false; clearTimeout(timer); document.body.classList.add('stopped'); }
  if (!reduced && VS().length > 1) timer = setTimeout(tick, 1800); else stopAuto();

  /* ---- save ---- */
  const sheet = $('#sheet'), scrim = $('#scrim');
  const slug = s => (s || 'word').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'word';
  function doc() { const name = $('#myName').value.trim() || st.word; return { axl_verb: '0.1', name, based_on: st.word, tweaks: [...st.mine],
    checks: [...st.mine].filter(i => T[i].check).map(i => ({ tweak: i, check: T[i].check })), judgment: [...st.mine].filter(i => !T[i].check).map(i => T[i].name),
    closest: allVersions.map(v => ({ word: v.word, source: v.src, overlap: +jac([...st.mine], v.tweaks).toFixed(2) })).sort((a, b) => b.overlap - a.overlap).slice(0, 3) }; }
  $('#save').addEventListener('click', () => { const d = doc(), f = slug(d.name) + '.axl.json';
    $('#sheetTitle').textContent = `my ${d.name}`; $('#json').textContent = JSON.stringify(d, null, 2); $('#cmd').textContent = `python3 axl/axl.py check ${f} yourpage.html`;
    sheet.inert = false; sheet.classList.add('open'); scrim.classList.add('open'); $('#dl').focus(); });
  const close = () => { sheet.classList.remove('open'); scrim.classList.remove('open'); sheet.inert = true; $('#save').focus(); };
  $('#close').addEventListener('click', close); scrim.addEventListener('click', close); addEventListener('keydown', e => { if (e.key === 'Escape' && sheet.classList.contains('open')) close(); });
  const copy = (t, b) => { const o = b.textContent, ok = () => { b.textContent = 'Copied'; setTimeout(() => b.textContent = o, 1200); }; try { navigator.clipboard.writeText(t).then(ok, ok); } catch (e) { ok(); } };
  $('#cp').addEventListener('click', e => copy($('#json').textContent, e.currentTarget));
  $('#cpc').addEventListener('click', e => copy($('#cmd').textContent, e.currentTarget));
  $('#dl').addEventListener('click', () => { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([$('#json').textContent], { type: 'application/json' })); a.download = slug(doc().name) + '.axl.json'; document.body.appendChild(a); a.click(); a.remove(); });

  /* ---- below: the part nobody can check ---- */
  $('#bigNo').textContent = `${D.stats.sources} sources. ${D.stats.words} words. ${D.stats.tweaks} tweaks. No standard.`;
  $('#vagueSub').textContent = `${D.stats.vague} of ${D.stats.statements} statements name no concrete change at all. These are the ones an agent has to guess.`;
  $('#vague').innerHTML = D.vague.slice(0, 9).map(v => `<blockquote>${esc(v.text)}<cite>${esc(v.src)} · “${esc(v.word)}”${v.verified ? '' : ' · paraphrase, not verified'}</cite></blockquote>`).join('');
  $('#foot').textContent = `Statements from ${D.stats.sources} public sources. Statement-to-tweak mapping is model-assisted and open to challenge. Checks run with python3 axl/axl.py.`;

  render();
  window.axlReady = true;
})();
</script>
</body>
</html>
