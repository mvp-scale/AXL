<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AXL Verb Studio</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect x=%278%27 y=%278%27 width=%2716%27 height=%2716%27 rx=%274%27 fill=%27%23d1175e%27/%3E%3C/svg%3E">
<meta name="description" content="Pick design words and sources, press play, and watch what each one actually changes on the same page.">
<style>
/* Concept: two identical pickers (words, sources) drive one stage. Play walks through either list; the page changes and the tweak board lights up below. */
:root{
  --bg:#f7f7f5;--panel:#ffffff;--ink:#131316;--muted:#5b5d66;--line:#dfe0e4;--soft:#eeeff1;
  --mine:#d1175e;--on-mine:#ffffff;--ok:#0b7a4b;
  --c1:#2a78d6;--c2:#eb6834;--c3:#1baf7a;--c4:#eda100;--c5:#008300;--c6:#4a3aa7;--c7:#e34948;--cx:#8b8e97;
  --sans:"Inter Tight","Helvetica Neue",Arial,system-ui,sans-serif;--mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101114;--panel:#17181c;--ink:#f1f1f3;--muted:#a3a6b0;--line:#2b2d34;--soft:#202228;--mine:#ff4f8f;--on-mine:#1a0610;--ok:#4cd694;--c1:#3987e5;--c2:#d95926;--c3:#199e70;--c4:#c98500;--c5:#008300;--c6:#9085e9;--c7:#e66767;--cx:#6b6e78;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#101114;--panel:#17181c;--ink:#f1f1f3;--muted:#a3a6b0;--line:#2b2d34;--soft:#202228;--mine:#ff4f8f;--on-mine:#1a0610;--ok:#4cd694;--c1:#3987e5;--c2:#d95926;--c3:#199e70;--c4:#c98500;--c5:#008300;--c6:#9085e9;--c7:#e66767;--cx:#6b6e78;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 var(--sans);-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:3px solid var(--mine);outline-offset:2px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
kbd{font:600 .75rem var(--mono);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:1px 5px;background:var(--panel)}
.wrap{max-width:1240px;margin:0 auto;padding-inline:clamp(12px,2.4vw,28px)}

/* controls */
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding-block:16px 10px;position:relative}
.pick{display:inline-flex;align-items:stretch;border-radius:16px;background:var(--panel);box-shadow:0 0 0 1px var(--line);position:relative}
.pbtn{display:flex;flex-direction:column;align-items:flex-start;justify-content:center;padding:6px 14px 8px;min-height:64px;border-radius:16px 0 0 16px;text-align:left}
.pbtn:hover{background:var(--soft)}
.pbtn small{font:700 .66rem var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.pbtn b{font-size:clamp(1.4rem,2.6vw,2rem);font-weight:800;letter-spacing:-.03em;line-height:1.05;display:flex;align-items:center;gap:8px;max-width:48vw;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.pbtn b i{width:12px;height:12px;border-radius:50%;flex:none;background:var(--cur,var(--ink))}
.play{width:56px;border-left:1px solid var(--line);border-radius:0 16px 16px 0;display:grid;place-items:center}
.play:hover{background:var(--soft)}
.play svg{width:22px;height:22px}
.play[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.times{font:800 1.4rem var(--sans);color:var(--muted)}
.nums{display:flex;gap:18px;margin-left:auto;flex-wrap:wrap}
.nums div{display:flex;flex-direction:column;align-items:flex-end}
.nums b{font-size:1.5rem;font-weight:800;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.nums span{font-size:.72rem;color:var(--muted)}
.nums .zero b{color:var(--mine)}
.pop{position:absolute;left:0;top:calc(100% + 6px);z-index:30;width:min(680px,calc(100vw - 24px));background:var(--panel);border-radius:16px;box-shadow:0 0 0 1px var(--line),0 24px 60px -20px rgba(0,0,0,.4);padding:12px}
.pop[hidden]{display:none}
.pop .ph{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:.82rem;color:var(--muted)}
.pop .ph button{min-height:32px;padding:0 10px;border-radius:99px;border:1.5px solid var(--line);font-weight:600;font-size:.8rem;color:var(--ink)}
.pop .ph .done{margin-left:auto;background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px;max-height:min(60svh,460px);overflow:auto}
.tile{min-height:48px;text-align:left;padding:6px 10px;border-radius:10px;background:var(--soft);display:flex;gap:8px;align-items:center;border:2px solid transparent}
.tile i{width:12px;height:12px;border-radius:50%;background:var(--c);flex:none;opacity:.35}
.tile b{font-size:.95rem;display:block}.tile span{font:.7rem var(--mono);color:var(--muted)}
.tile[aria-pressed="true"]{border-color:var(--c);background:var(--panel)}.tile[aria-pressed="true"] i{opacity:1}

/* stage */
.stage{position:relative}
.frame{position:relative;border-radius:14px;overflow:hidden;background:var(--soft);box-shadow:0 0 0 1px var(--line),0 30px 80px -40px rgba(0,0,0,.45);aspect-ratio:980/760;width:100%;height:clamp(340px,calc(100svh - 400px),760px);margin-inline:auto;aspect-ratio:auto;user-select:none;outline:3px solid var(--cur,transparent);outline-offset:-3px}
.frame iframe{position:absolute;left:0;top:0;width:980px;height:760px;border:0;transform-origin:0 0;pointer-events:none}
#pv{transition:opacity .16s ease}
.frame.peeking #pv{opacity:0}.frame.peeking{--cur:var(--ink)}
.state{position:absolute;left:12px;bottom:14px;z-index:3;display:inline-flex;align-items:center;gap:8px;font:700 .9rem var(--sans);padding:8px 14px 8px 11px;border-radius:99px;background:#131316;color:#fff;box-shadow:0 6px 18px rgba(0,0,0,.25);pointer-events:none;max-width:60%}
.state::before{content:"";width:12px;height:12px;border-radius:50%;background:var(--cur,#fff);flex:none}
.state span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.frame.peeking .state{background:#fff;color:#131316;box-shadow:0 0 0 2px #131316}.frame.peeking .state::before{background:#131316}
.hold{position:absolute;right:12px;bottom:14px;z-index:3;min-height:44px;padding:0 16px;border-radius:99px;background:rgba(19,19,22,.86);color:#fff;font-weight:700;font-size:.88rem;display:inline-flex;align-items:center;gap:8px;box-shadow:0 8px 24px rgba(0,0,0,.3);touch-action:none}
.hold kbd{background:transparent;color:#fff;border-color:rgba(255,255,255,.5)}
.frame.peeking .hold{background:#fff;color:#131316}.frame.peeking .hold kbd{color:#131316;border-color:#131316}
.steps{display:flex;gap:3px;margin:0 0 8px;min-height:4px}
.steps i{flex:1;height:4px;border-radius:2px;background:var(--line)}
.steps i.on{background:var(--cur,var(--ink))}.steps i.done{background:var(--muted);opacity:.5}
.says{min-height:1.5em;margin:8px 2px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:.98rem;color:var(--muted)}
.says q{color:var(--ink);font-weight:600}.says a{color:inherit;font:.78rem var(--mono)}

/* board */
.boardh{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:14px 0 8px;flex-wrap:wrap}
.boardh h2{margin:0;font-size:1.3rem;letter-spacing:-.02em}
.boardh span{font-size:.82rem;color:var(--muted)}
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px;align-items:start}
.col{background:var(--panel);border-radius:14px;box-shadow:0 0 0 1px var(--line);padding:10px 10px 8px}
.col h3{margin:2px 4px 6px;font:700 .68rem var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between}
.tw{width:100%;min-height:30px;display:flex;align-items:center;gap:8px;padding:4px 6px;border-radius:8px;text-align:left;font-size:.86rem;color:var(--muted);transition:background .25s,color .25s}
.tw:hover{background:var(--soft)}
.tw .d{width:9px;height:9px;border-radius:50%;background:var(--line);flex:none;transition:background .25s,transform .25s}
.tw .nm{flex:1}
.tw .ck{color:var(--ok);font-size:.75rem}
.tw .ct{font:700 .7rem var(--mono);color:var(--muted);min-width:2.6em;text-align:right}
.tw.lit{color:var(--ink);font-weight:650}
.tw.lit .d{background:var(--cur,var(--ink));transform:scale(1.35)}
.tw.any .d{background:var(--muted)}
.tw.lit.any .d{background:var(--cur,var(--ink))}
.tw[aria-pressed="true"] .nm{color:var(--mine);font-weight:750}
.tw[aria-pressed="true"] .nm::after{content:" ●";font-size:.7em}

/* tray */
.tray{position:sticky;bottom:0;z-index:5;margin-top:18px;background:var(--panel);border-radius:14px 14px 0 0;box-shadow:0 -1px 0 var(--line),0 -16px 40px -30px rgba(0,0,0,.4);padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.tray .name{display:flex;align-items:center;gap:6px;font-weight:800;font-size:1.2rem;letter-spacing:-.02em}
.tray input{width:8.5em;border:0;border-bottom:2px solid var(--mine);background:transparent;font-weight:800;letter-spacing:-.02em;padding:2px 0}
.tray .facts{font-size:.9rem;color:var(--muted);flex:1;min-width:220px}
.tray .facts b{color:var(--ink)}.tray .facts .m{color:var(--mine);font-weight:700}
.btn{min-height:44px;padding:0 18px;border-radius:99px;font-weight:700;border:1.5px solid var(--line)}
.btn.small{min-height:34px;padding:0 12px}
.btn.primary{background:var(--mine);color:var(--on-mine);border-color:var(--mine)}
.btn:disabled{opacity:.4;cursor:default}
.sheet{position:fixed;inset:auto 0 0 0;margin:auto;z-index:40;width:min(680px,100%);background:var(--panel);border-radius:18px 18px 0 0;box-shadow:0 -20px 60px rgba(0,0,0,.35);padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));transform:translateY(105%);transition:transform .35s cubic-bezier(.2,.9,.25,1);max-height:88svh;overflow:auto}
.sheet.open{transform:none}.sheet:not(.open){visibility:hidden;transition:transform .35s,visibility 0s .35s}
.sheet h2{margin:0 0 4px;font-size:1.4rem;letter-spacing:-.02em}
.sheet p{margin:0 0 10px;color:var(--muted)}
pre{margin:0 0 10px;background:var(--soft);border-radius:10px;padding:12px;overflow:auto;font:.8rem/1.45 var(--mono);max-height:260px}
.row2{display:flex;gap:8px;flex-wrap:wrap}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:39;opacity:0;pointer-events:none;transition:opacity .3s}.scrim.open{opacity:1;pointer-events:auto}
.below{padding-block:64px 80px;display:grid;grid-template-columns:minmax(0,1fr);gap:18px}
.below h2{font-size:clamp(1.5rem,3vw,2.2rem);letter-spacing:-.03em;margin:0}
.below .sub{color:var(--muted);margin:0}
.vague{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.vague blockquote{margin:0;background:var(--panel);border-radius:12px;box-shadow:0 0 0 1px var(--line);padding:12px 14px;font-size:.92rem}
.vague cite{display:block;margin-top:6px;font:.72rem var(--mono);color:var(--muted);font-style:normal}
.foot{color:var(--muted);font:.8rem var(--mono);text-align:center}
@media (max-width:760px){.frame{height:auto;aspect-ratio:980/760}.says{white-space:normal}.nums{margin-left:0}.nums div{align-items:flex-start}.times{display:none}.frame{max-height:none}.hold kbd{display:none}.state{max-width:52%}
  .tray{gap:8px;padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px))}.tray .facts{flex-basis:100%;order:3;font-size:.82rem;min-width:0}.tray input{width:6.5em}.tray .btn{min-height:40px;padding:0 14px}}
@media (hover:none){.hold kbd{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="bar">
    <div class="pick" id="pickW">
      <button class="pbtn" type="button" data-axis="w" aria-haspopup="true" aria-expanded="false"><small>Words</small><b><i></i><span class="lab"></span></b></button>
      <button class="play" type="button" data-play="w" aria-pressed="false" aria-label="Walk through the words"></button>
      <div class="pop" hidden data-pop="w"></div>
    </div>
    <span class="times" aria-hidden="true">×</span>
    <div class="pick" id="pickS">
      <button class="pbtn" type="button" data-axis="s" aria-haspopup="true" aria-expanded="false"><small>Sources</small><b><i></i><span class="lab"></span></b></button>
      <button class="play" type="button" data-play="s" aria-pressed="false" aria-label="Walk through the sources"></button>
      <div class="pop" hidden data-pop="s"></div>
    </div>
    <div class="nums" id="nums" aria-live="polite"></div>
  </header>

  <section class="stage" aria-label="The demo page">
    <div class="steps" id="steps" aria-hidden="true"></div>
    <div class="frame" id="frame">
      <iframe id="pv0" title="Demo page, original" tabindex="-1" aria-hidden="true"></iframe>
      <iframe id="pv" title="Demo page with the current selection applied" tabindex="-1"></iframe>
      <span class="state" id="state"><span id="stateTxt"></span></span>
      <button class="hold" id="hold" type="button" aria-label="Hold to see the original"><kbd>Shift</kbd> hold for original</button>
    </div>
    <p class="says" id="says" aria-live="polite"></p>
  </section>

  <section aria-labelledby="bh">
    <div class="boardh"><h2 id="bh">Every tweak, lighting up</h2><span id="bsub"></span></div>
    <div class="board" id="board"></div>
  </section>

  <footer class="tray" aria-label="Your word">
    <div class="name">my <input id="myName" aria-label="Name of your word" value="polish" maxlength="24"></div>
    <div class="facts" id="facts" aria-live="polite"></div>
    <button class="btn" id="clear" type="button">Clear</button>
    <button class="btn primary" id="save" type="button">Save my word</button>
  </footer>

  <main class="below">
    <h2 id="bigNo"></h2>
    <p class="sub" id="vagueSub"></p>
    <div class="vague" id="vague"></div>
    <p class="foot" id="foot"></p>
  </main>
</div>

<div class="scrim" id="scrim"></div>
<aside class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" inert>
  <h2 id="sheetTitle"></h2>
  <p>This file is the whole definition. A command runs the checks; no agent has to guess what the word means.</p>
  <pre id="json" tabindex="0"></pre>
  <pre id="cmd" tabindex="0"></pre>
  <div class="row2"><button class="btn primary" id="dl" type="button">Download</button><button class="btn" id="cp" type="button">Copy file</button><button class="btn" id="cpc" type="button">Copy command</button><button class="btn" id="close" type="button">Close</button></div>
</aside>

<script>
const D = /*DATA*/null;
(function () {
  'use strict';
  const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
  const esc = t => String(t == null ? '' : t).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const T = Object.fromEntries(D.tweaks.map(t => [t.id, t]));
  const PAL = ['var(--c1)', 'var(--c2)', 'var(--c3)', 'var(--c4)', 'var(--c5)', 'var(--c6)', 'var(--c7)'];
  const LIST = { w: D.words, s: D.sources };
  const color = (axis, name) => PAL[LIST[axis].indexOf(name)] || 'var(--cx)';
  const PLAY = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4.5v15l13-7.5z"/></svg>', PAUSE = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>';
  const st = { sel: { w: new Set(['polish']), s: new Set(D.sources) }, walk: null, idx: 0, mine: new Set(), peek: false, mineView: false };
  let timer = null;

  /* the entries that match the selection, optionally narrowed to the current walk step */
  const inSel = e => st.sel.w.has(e.word) && st.sel.s.has(e.src);
  const walkItems = axis => LIST[axis].filter(n => st.sel[axis].has(n) && D.entries.some(e => inSel(e) && (axis === 'w' ? e.word : e.src) === n));
  function current() {
    if (st.mineView) return { label: `Your ${$('#myName').value || 'word'}`, color: 'var(--mine)', tweaks: [...st.mine], entries: [] };
    let es = D.entries.filter(inSel), label, col = 'var(--ink)';
    if (st.walk) { const items = walkItems(st.walk), n = items[st.idx % Math.max(1, items.length)]; if (n) { es = es.filter(e => (st.walk === 'w' ? e.word : e.src) === n); col = color(st.walk, n);
      const other = st.walk === 'w' ? st.sel.s : st.sel.w, one = other.size === 1 ? [...other][0] : null;
      label = st.walk === 'w' ? `“${n}”${one ? ` · ${one}` : ` · ${new Set(es.map(e => e.src)).size} sources`}` : `${n}${one ? ` · “${one}”` : ` · ${new Set(es.map(e => e.word)).size} words`}`; } }
    if (!label) label = `${st.sel.w.size === 1 ? `“${[...st.sel.w][0]}”` : `${st.sel.w.size} words`} · ${st.sel.s.size === D.sources.length ? 'all sources' : st.sel.s.size === 1 ? [...st.sel.s][0] : `${st.sel.s.size} sources`}`;
    return { label, color: col, tweaks: [...new Set(es.flatMap(e => e.tweaks))], entries: es };
  }

  /* ---- pickers: two of the same thing ---- */
  function renderPick(axis) {
    const sel = st.sel[axis], all = LIST[axis], p = $(`#pick${axis === 'w' ? 'W' : 'S'}`);
    const lab = sel.size === all.length ? `all ${all.length}` : sel.size === 1 ? [...sel][0] : sel.size === 0 ? 'none' : `${sel.size} ${axis === 'w' ? 'words' : 'sources'}`;
    p.querySelector('.lab').textContent = lab;
    p.querySelector('.pbtn b i').style.setProperty('--cur', sel.size === 1 ? color(axis, [...sel][0]) : 'var(--ink)');
    const pl = p.querySelector('.play'); pl.innerHTML = st.walk === axis ? PAUSE : PLAY; pl.setAttribute('aria-pressed', st.walk === axis);
    const pop = p.querySelector('.pop');
    if (!pop.hidden) pop.innerHTML = `<div class="ph"><span>${axis === 'w' ? 'Design words' : 'Who defines them'} · pick any</span><button type="button" data-all="1">All</button><button type="button" data-none="1">None</button><button type="button" class="done">Done</button></div><div class="tiles">${all.map(n => {
      const es = D.entries.filter(e => (axis === 'w' ? e.word : e.src) === n), k = axis === 'w' ? new Set(es.map(e => e.src)).size : new Set(es.map(e => e.word)).size;
      return `<button class="tile" type="button" data-n="${esc(n)}" style="--c:${color(axis, n)}" aria-pressed="${sel.has(n)}"><i></i><span style="display:block"><b>${esc(n)}</b><span>${k} ${axis === 'w' ? 'source' : 'word'}${k === 1 ? '' : 's'}</span></span></button>`; }).join('')}</div>`;
  }
  $$('.pick').forEach(p => {
    const axis = p.querySelector('.pbtn').dataset.axis, pop = p.querySelector('.pop'), btn = p.querySelector('.pbtn');
    btn.addEventListener('click', () => { const open = pop.hidden; closePops(); pop.hidden = !open; btn.setAttribute('aria-expanded', open); renderPick(axis); if (open) (pop.querySelector('.tile') || pop).focus(); });
    pop.addEventListener('click', e => {
      const t = e.target.closest('.tile'); stopWalk();
      if (t) { const n = t.dataset.n, s = st.sel[axis]; s.has(n) ? s.delete(n) : s.add(n); }
      if (e.target.closest('[data-all]')) LIST[axis].forEach(n => st.sel[axis].add(n));
      if (e.target.closest('[data-none]')) st.sel[axis].clear();
      if (e.target.closest('.done')) { closePops(); btn.focus(); }
      st.mineView = false; render(true);
    });
    p.querySelector('.play').addEventListener('click', () => { st.walk === axis ? stopWalk() : startWalk(axis); render(true); });
  });
  const closePops = () => $$('.pop').forEach(p => { p.hidden = true; p.parentNode.querySelector('.pbtn').setAttribute('aria-expanded', 'false'); });
  document.addEventListener('click', e => { if (e.target.isConnected && !e.target.closest('.pick')) closePops(); });

  /* ---- walking ---- */
  function startWalk(axis) { stopWalk(); st.walk = axis; st.idx = 0; st.mineView = false; if (!reduced) timer = setTimeout(step, 1900); }
  function step() { if (!st.walk) return; st.idx = (st.idx + 1) % Math.max(1, walkItems(st.walk).length); render(false); timer = setTimeout(step, 1900); }
  function stopWalk() { clearTimeout(timer); timer = null; st.walk = null; }

  /* ---- the page: original underneath, the selection on top ---- */
  const pv = $('#pv'), pv0 = $('#pv0'), frame = $('#frame');
  pv.srcdoc = D.before; pv0.srcdoc = D.before;
  const fit = () => { const sc = Math.min(frame.clientWidth / D.frame.width, frame.clientHeight / D.frame.height), dx = (frame.clientWidth - D.frame.width * sc) / 2, s = `translateX(${dx}px) scale(${sc})`; pv.style.transform = s; pv0.style.transform = s; };
  new ResizeObserver(fit).observe(frame);
  const cssOf = ids => ids.map(i => T[i] && T[i].css).filter(Boolean).join('\n');
  const selsOf = css => [...new Set([...css.replace(/@media[^{]*\{/g, '').matchAll(/([^{}]+)\{[^{}]*\}/g)].flatMap(m => m[1].split(',')).map(s => s.replace(/::?[a-z-]+(\([^)]*\))?/g, '').trim()).filter(s => s && s !== '*' && !/^(html|body)$/.test(s)))];
  const post = (css, hl) => { try { pv.contentWindow.postMessage({ type: 'lab-recipe', css, highlight: hl }, '*'); } catch (e) {} };
  let flashT = null;
  function paint(cur, flash) {
    const css = cssOf(cur.tweaks), hl = flash && !reduced && css ? selsOf(css).join(',') + '{outline:2px dashed rgba(209,23,94,.6)!important;outline-offset:1px}' : '';
    post(css, hl); clearTimeout(flashT); if (hl) flashT = setTimeout(() => post(css, ''), 1100);
  }
  pv.addEventListener('load', () => { fit(); render(false); }); pv0.addEventListener('load', fit);
  const peek = on => { if (st.peek === on) return; st.peek = on; frame.classList.toggle('peeking', on); $('#stateTxt').textContent = on ? 'Original' : current().label; if (!on) paint(current(), true); };
  addEventListener('keydown', e => {
    if (e.target.closest && e.target.closest('input')) return;
    if (e.key === 'Shift') { stopWalk(); renderPicks(); peek(true); }
    if (e.key === 'Escape') { closePops(); if ($('#sheet').classList.contains('open')) closeSheet(); }
    if (e.key === 'y' || e.key === 'Y') { stopWalk(); st.mineView = true; render(true); }
  });
  addEventListener('keyup', e => { if (e.key === 'Shift') peek(false); });
  addEventListener('blur', () => peek(false));
  const hold = $('#hold');
  hold.addEventListener('pointerdown', e => { e.preventDefault(); stopWalk(); renderPicks(); peek(true); hold.setPointerCapture(e.pointerId); });
  ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(ev => hold.addEventListener(ev, () => peek(false)));
  hold.addEventListener('keydown', e => { if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); peek(true); } });
  hold.addEventListener('keyup', e => { if (e.key === ' ' || e.key === 'Enter') peek(false); });

  /* ---- the board: every tweak, once ---- */
  $('#board').innerHTML = D.categories.map(c => { const ts = D.tweaks.filter(t => t.category === c).sort((a, b) => D.entries.filter(e => e.tweaks.includes(b.id)).length - D.entries.filter(e => e.tweaks.includes(a.id)).length); return ts.length ? `<div class="col"><h3><span>${esc(c)}</span><span data-cc="${esc(c)}"></span></h3>${ts.map(t => `<button class="tw" type="button" data-id="${esc(t.id)}" aria-pressed="false"><span class="d"></span><span class="nm">${esc(t.name)}</span>${t.check ? '<span class="ck" title="a tool checks it">✓</span>' : ''}<span class="ct"></span></button>`).join('')}</div>` : ''; }).join('');
  $('#board').addEventListener('click', e => { const b = e.target.closest('.tw'); if (!b) return; stopWalk(); const id = b.dataset.id; st.mine.has(id) ? st.mine.delete(id) : st.mine.add(id); st.mineView = st.mine.size > 0; render(true); });

  /* ---- your word ---- */
  const jac = (a, b) => { const B = new Set(b); let i = 0; a.forEach(x => { if (B.has(x)) i++; }); const u = new Set([...a, ...b]).size; return u ? i / u : 0; };
  function facts() {
    const n = st.mine.size, ck = [...st.mine].filter(i => T[i].check).length;
    if (!n) { $('#facts').innerHTML = `Tap any tweak on the board to build <b>your</b> word, or <button class="btn small" id="startFrom" type="button">start from what's on screen</button>`; return; }
    const near = D.entries.filter(e => e.tweaks.length).map(e => ({ e, s: jac([...st.mine], e.tweaks) })).sort((a, b) => b.s - a.s).slice(0, 2).filter(x => x.s > 0);
    $('#facts').innerHTML = `<b>${n}</b> tweak${n > 1 ? 's' : ''} · <b>${ck}</b> a tool can check · nearest: ${near.length ? near.map(x => `<span class="m">${esc(x.e.word)}</span> (${esc(x.e.src)}) ${Math.round(x.s * 100)}%`).join(', ') : 'nothing named'}`;
  }
  $('#facts').addEventListener('click', e => { if (e.target.id === 'startFrom') { const c = current(); stopWalk(); c.tweaks.forEach(i => st.mine.add(i)); st.mineView = true; render(true); } });
  $('#myName').addEventListener('input', () => { facts(); if (st.mineView) $('#stateTxt').textContent = current().label; });
  $('#clear').addEventListener('click', () => { st.mine.clear(); st.mineView = false; render(true); });

  const renderPicks = () => { renderPick('w'); renderPick('s'); };
  function render(flash) {
    const cur = current(); frame.style.setProperty('--cur', cur.color); document.documentElement.style.setProperty('--cur', cur.color);
    if (!st.peek) { paint(cur, flash); $('#stateTxt').textContent = cur.label; }
    renderPicks();
    // walk progress
    const items = st.walk ? walkItems(st.walk) : []; $('#steps').innerHTML = items.map((_, i) => `<i class="${i === st.idx % items.length ? 'on' : i < st.idx % items.length ? 'done' : ''}"></i>`).join('');
    // numbers for the whole selection: the lack of a standard, counted
    const sel = D.entries.filter(inSel), union = new Set(sel.flatMap(e => e.tweaks)), n = sel.length;
    const cnt = id => sel.filter(e => e.tweaks.includes(id)).length, allShared = n > 1 ? [...union].filter(i => cnt(i) === n).length : null;
    const indep = new Set(sel.map(e => e.derives_from || e.src)).size;
    $('#nums').innerHTML = `<div><b>${n}</b><span>definitions</span></div><div><b>${indep}</b><span>independent</span></div><div><b>${union.size}</b><span>tweaks</span></div>` + (allShared != null ? `<div class="${allShared ? '' : 'zero'}"><b>${allShared}</b><span>shared by all</span></div>` : '');
    // board
    const lit = new Set(cur.tweaks);
    $$('#board .tw').forEach(b => { const id = b.dataset.id, c = cnt(id); b.classList.toggle('lit', lit.has(id)); b.classList.toggle('any', c > 0); b.setAttribute('aria-pressed', st.mine.has(id)); b.querySelector('.ct').textContent = c ? `${c}/${n}` : ''; });
    $('#bsub').textContent = `${lit.size} lit for ${cur.label.replace(/[“”]/g, '')} · counts show how many of the ${n} selected definitions ask for each`;
    // quote
    const e = cur.entries.length === 1 ? cur.entries[0] : cur.entries.find(x => x.quote);
    $('#says').innerHTML = st.mineView ? `Your ${esc($('#myName').value || 'word')}: ${st.mine.size} tweak${st.mine.size === 1 ? '' : 's'}.` : e && e.quote ? `${esc(e.src)} on “${esc(e.word)}”: <q>${esc(e.quote)}</q> <a href="${esc(e.url)}" target="_blank" rel="noopener noreferrer">source</a>` : `${cur.tweaks.length} tweaks from ${cur.entries.length} definitions.`;
    $('#save').disabled = !st.mine.size; facts();
  }

  /* ---- save ---- */
  const sheet = $('#sheet'), scrim = $('#scrim');
  const slug = s => (s || 'word').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'word';
  function doc() { const name = $('#myName').value.trim() || 'word'; return { axl_verb: '0.1', name, tweaks: [...st.mine],
    checks: [...st.mine].filter(i => T[i].check).map(i => ({ tweak: i, check: T[i].check })), judgment: [...st.mine].filter(i => !T[i].check).map(i => T[i].name),
    closest: D.entries.map(e => ({ word: e.word, source: e.src, overlap: +jac([...st.mine], e.tweaks).toFixed(2) })).sort((a, b) => b.overlap - a.overlap).slice(0, 3) }; }
  $('#save').addEventListener('click', () => { const d = doc(), f = slug(d.name) + '.axl.json';
    $('#sheetTitle').textContent = `my ${d.name}`; $('#json').textContent = JSON.stringify(d, null, 2); $('#cmd').textContent = `python3 axl/axl.py check ${f} yourpage.html`;
    sheet.inert = false; sheet.classList.add('open'); scrim.classList.add('open'); $('#dl').focus(); });
  const closeSheet = () => { sheet.classList.remove('open'); scrim.classList.remove('open'); sheet.inert = true; $('#save').focus(); };
  $('#close').addEventListener('click', closeSheet); scrim.addEventListener('click', closeSheet);
  const copy = (t, b) => { const o = b.textContent, ok = () => { b.textContent = 'Copied'; setTimeout(() => b.textContent = o, 1200); }; try { navigator.clipboard.writeText(t).then(ok, ok); } catch (e) { ok(); } };
  $('#cp').addEventListener('click', e => copy($('#json').textContent, e.currentTarget));
  $('#cpc').addEventListener('click', e => copy($('#cmd').textContent, e.currentTarget));
  $('#dl').addEventListener('click', () => { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([$('#json').textContent], { type: 'application/json' })); a.download = slug(doc().name) + '.axl.json'; document.body.appendChild(a); a.click(); a.remove(); });

  $('#bigNo').textContent = `${D.stats.sources} sources. ${D.stats.words} words. ${D.stats.tweaks} tweaks. No standard.`;
  $('#vagueSub').textContent = `${D.stats.vague} statements name no concrete change at all. These are the ones an agent has to guess.`;
  $('#vague').innerHTML = D.vague.slice(0, 9).map(v => `<blockquote>${esc(v.text)}<cite>${esc(v.src)} · “${esc(v.word)}”${v.verified ? '' : ' · paraphrase, not verified'}</cite></blockquote>`).join('');
  $('#foot').textContent = 'Quotes are verbatim from fetched pages. Which tweaks a statement asks for is model-assisted and open to challenge. Checks run with python3 axl/axl.py.';

  // open: polish, all sources, walking through the sources
  if (!reduced) startWalk('s');
  render(false);
  window.axlReady = true;
})();
</script>
</body>
</html>
